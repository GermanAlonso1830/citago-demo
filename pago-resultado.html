<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <script>
// Remove only legacy NUVALITE data; never restore a persistent access token.
(function () {
  ['nuvalite_access_token', 'nuvalite_session', 'citago_demo_final_v1'].forEach(function (key) {
    try { window.localStorage.removeItem(key); } catch (error) { /* Storage can be disabled. */ }
  });
})();
</script>
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="referrer" content="no-referrer">
 <title>Resultado del pago · CitaLite</title>
 <style>
  *{box-sizing:border-box}
  body{margin:0;background:#f7f7ff;color:#211b36;font:16px/1.5 system-ui,sans-serif}
  main{width:min(100% - 32px,540px);margin:10vh auto;background:white;border:1px solid #e7e3f2;border-radius:22px;padding:clamp(20px,5vw,36px)}
  h1{margin:0;font-size:clamp(1.65rem,5vw,2rem)}
  p{margin:12px 0}
  #summary{color:#5b526c}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  a,button{color:#45349b;font:inherit;font-weight:650;padding:10px 14px;border:1px solid #ded7ef;border-radius:10px;background:white;text-decoration:none}
  button{cursor:pointer}
  [hidden]{display:none!important}
 </style>
</head>
<body>
 <main>
  <h1>Resultado del pago</h1>
  <p id="summary" hidden></p>
  <p id="status" role="status" aria-live="polite">Consultando el pago…</p>
  <div class="actions">
   <a id="back" href="mi-cuenta.html">Volver a Mi cuenta</a>
   <a id="login" hidden>Iniciar sesión</a>
   <button id="refresh" type="button" hidden>Consultar estado</button>
  </div>
 </main>
 <script>
  const params=new URLSearchParams(location.search);
  const business=params.get("negocio"),reference=params.get("referencia");
  const uuid=/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
  const api=["localhost","127.0.0.1"].includes(location.hostname)
   ?"http://127.0.0.1:8000":"https://citago-backend.onrender.com";
  const statusText=document.getElementById("status");
  const summary=document.getElementById("summary");
  const refresh=document.getElementById("refresh");
  const login=document.getElementById("login");
  const back=document.getElementById("back");
  const messages={
   PENDING:"Pago pendiente de confirmación.",
   APPROVED:"Pago aprobado.",
   DECLINED:"Pago rechazado.",
   VOIDED:"Pago anulado.",
   ERROR:"No fue posible completar el pago.",
   EXPIRED:"El enlace de pago venció. Puedes iniciar otro desde Mi plan.",
   REVIEW:"El pago requiere revisión. Comunícate con la plataforma e indica la referencia del pago."
  };
  let checking=false,checks=0,timer;

  function requireLogin(){
   const next="pago-resultado.html?"+new URLSearchParams({negocio:business,referencia:reference});
   login.href="login.html?"+new URLSearchParams({next});
   login.hidden=false;
   refresh.hidden=true;
   statusText.textContent="Inicia sesión para consultar el resultado del pago.";
  }
  async function checkStatus(){
   if(checking)return;
   clearTimeout(timer);
   const token=sessionStorage.getItem("nuvalite_access_token");
   if(!token){requireLogin();return}
   checking=true;
   refresh.disabled=true;
   try{
    const response=await fetch(api+"/businesses/"+business+"/plan-payments/"+reference,{
     cache:"no-store",headers:{Authorization:"Bearer "+token},signal:AbortSignal.timeout(10000)
    });
    if(response.status===401){
     sessionStorage.removeItem("nuvalite_access_token");
     sessionStorage.removeItem("nuvalite_session");
     requireLogin();
     return;
    }
    if(response.status===403||response.status===404){
     statusText.textContent=response.status===403?"Tu cuenta no tiene acceso a este pago.":"Pago no encontrado.";
     refresh.hidden=true;
     return;
    }
    if(!response.ok)throw new Error();
    const payment=await response.json();
    const price=new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:2});
    summary.textContent=payment.plan_name+" · "+price.format(payment.amount_in_cents/100)+(payment.test_mode?" · Prueba":"");
    summary.hidden=false;
    statusText.textContent=messages[payment.status]||"Estado no disponible.";
    if(payment.status==="APPROVED"){
     if(payment.test_mode)statusText.textContent+=" Es un pago de prueba.";
     else if(payment.plan_applied)statusText.textContent+=" Tu suscripción se actualizó.";
    }
    if(payment.status==="REVIEW")statusText.textContent+=" Referencia: "+reference;
    refresh.hidden=payment.status!=="PENDING";
    if(payment.status==="PENDING"&&++checks<20)timer=setTimeout(checkStatus,3000);
   }catch{
    statusText.textContent="No pudimos consultar el pago. Intenta de nuevo.";
    refresh.hidden=false;
   }finally{
    checking=false;
    refresh.disabled=false;
   }
  }

  if(uuid.test(business||"")&&uuid.test(reference||"")){
   back.href="negocio.html?"+new URLSearchParams({id:business,vista:"plan"});
   back.textContent="Volver a Mi plan";
   refresh.addEventListener("click",()=>{checks=0;checkStatus()});
   checkStatus();
  }else statusText.textContent="El enlace de resultado está incompleto.";
 </script>
</body>
</html>
