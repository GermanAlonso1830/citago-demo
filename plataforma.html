<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CitaGo · Plataforma</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"><style>
:root{
  --bg:#fbf5f7;--sf:#fff;--ink:#251c2c;--mut:#746a7a;--line:#eadfe5;
  --acc:#6d5bd0;--side:#251d45;--ok:#16794c;--warn:#9a6200;--bad:#b3372a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:20px 12px}
.side h2{font:700 1.25rem Georgia,serif;margin:0 8px 18px}
.side button{display:block;width:100%;border:0;background:none;color:#fff;opacity:.78;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}
.side button.on{background:rgba(255,255,255,.14);opacity:1;font-weight:800}
.main{padding:24px;min-width:0}
.wrap{max-width:1000px;margin:auto}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.kpi b{display:block;font-size:1.8rem}.kpi span{color:var(--mut);font-size:.82rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:8px 12px;font-weight:700}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{border-color:#efb2aa;color:var(--bad)}
.item{border:1px solid var(--line);background:var(--sf);border-radius:14px;padding:12px;margin:8px 0}
.item small{display:block;color:var(--mut)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:.75rem;font-weight:800;background:#e4f4eb;color:var(--ok)}
.tag.w{background:#fff0d6;color:var(--warn)}.tag.x{background:#fbe0dd;color:var(--bad)}
.muted{color:var(--mut)}
.err{background:#fbe0dd;color:var(--bad);padding:10px;border-radius:10px}
.ok{background:#e4f4eb;color:var(--ok);padding:10px;border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem}
.loading{opacity:.7}
.hero{max-width:520px;margin:28px auto;background:var(--sf);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -35px #6d5bd0}
.heroHead{text-align:center;padding:30px;background:linear-gradient(180deg,#eee9ff,#fff)}
.mark{width:74px;height:74px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;margin:auto;font:700 2rem Georgia,serif;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.heroBody{padding:18px}
.choice{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0;background:#fff}
.choice .ico{font-size:1.4rem;width:36px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px}
.slots button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5;padding:8px;display:flex;overflow:auto}.side h2{display:none}.side button{white-space:nowrap;width:auto}.main{padding:16px}.g2,.g3{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div id="app"></div><script>
const API="https://citago-backend.onrender.com/";
let view="businesses",businesses=[],types=[],plans=[],error="",loading=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-CO");
async function api(path,opts={}){let r=await fetch(API+path,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||"HTTP "+r.status);return d}
async function load(){
 loading=true;error="";render();
 try{
  businesses=await api("/businesses");
  types=await api("/business-types");
  try{plans=await api("/platform/plans")}catch(_){plans=[]}
 }catch(e){error=e.message}finally{loading=false;render()}
}
async function createBusiness(){
 const name=document.getElementById("bn").value.trim(),slug=document.getElementById("bs").value.trim(),type=document.getElementById("bt").value;
 if(!name||!slug||!type)return alert("Completa nombre, slug y tipo.");
 await api("/businesses",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({business_type_id:type,name,slug,tagline:null,primary_color:"#6d5bd0",whatsapp:null,email:null,address:null,booking_mode:"AUTO",default_open_time:"08:00",default_close_time:"18:00",slot_minutes:30})});load();
}
async function createType(){
 const name=document.getElementById("tn").value.trim(),slug=document.getElementById("ts").value.trim();
 if(!name||!slug)return alert("Completa nombre y slug.");
 await api("/business-types",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,slug,icon:"📅",color:"#6d5bd0",professional_singular:"profesional",professional_plural:"Profesionales",notes_label:"Notas",notes_placeholder:"",default_open_time:"08:00",default_close_time:"18:00",default_slot_minutes:30})});load();
}
async function toggleBusiness(id,active){
 try{await api("/platform/businesses/"+id+"/active",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({is_active:active})});load()}catch(e){alert("Falta endpoint de plataforma: "+e.message)}
}
async function assignPlan(id){
 const el=document.getElementById("plan-"+id);if(!el||!el.value)return;
 try{await api("/platform/businesses/"+id+"/subscription",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({plan_id:el.value,status:"ACTIVE"})});alert("Plan actualizado");}catch(e){alert("Falta endpoint de plataforma: "+e.message)}
}
function nav(){return '<aside class="side"><h2>CitaGo</h2><button data-v="businesses" class="'+(view==="businesses"?"on":"")+'">🏢 Negocios</button><button data-v="types" class="'+(view==="types"?"on":"")+'">🧩 Tipos</button><button data-v="plans" class="'+(view==="plans"?"on":"")+'">💎 Planes</button></aside>'}
function businessPanel(){
 let rows=businesses.map(b=>'<tr><td><b>'+esc(b.name)+'</b><br><small class="muted">'+esc(b.slug)+'</small></td><td>'+esc(b.business_type_name||b.business_type_id||"—")+'</td><td><span class="tag '+(b.is_active===false?"x":"")+'">'+(b.is_active===false?"Suspendido":"Activo")+'</span></td><td><select id="plan-'+b.id+'"><option value="">Asignar plan…</option>'+plans.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+money(p.price_cop)+'</option>').join("")+'</select></td><td><div class="row"><button class="btn" data-plan="'+b.id+'">Guardar plan</button><button class="btn '+(b.is_active===false?"p":"bad")+'" data-toggle="'+b.id+'" data-active="'+(b.is_active===false?"1":"0")+'">'+(b.is_active===false?"Activar":"Suspender")+'</button></div></td></tr>').join("");
 return '<h1>Plataforma CitaGo</h1><p class="sub">Administración central</p><div class="card"><table><tr><th>Negocio</th><th>Tipo</th><th>Estado</th><th>Plan</th><th>Acciones</th></tr>'+rows+'</table></div><div class="card"><h3>Nuevo negocio</h3><label>Nombre</label><input id="bn" placeholder="Ej. Colegio Público"><label>Slug</label><input id="bs" placeholder="colegio-publico"><label>Tipo</label><select id="bt"><option value="">Selecciona…</option>'+types.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join("")+'</select><button class="btn p" data-a="createBusiness" style="margin-top:10px">Crear negocio</button></div>';
}
function typesPanel(){
 return '<h1>Tipos de negocio</h1><p class="sub">La plantilla define vocabulario y valores base; cada negocio crea sus servicios.</p>'+types.map(t=>'<div class="item"><b>'+esc(t.icon||"📅")+' '+esc(t.name)+'</b><small>'+esc(t.slug)+' · '+esc(t.professional_plural||"Profesionales")+' · '+t.default_slot_minutes+' min</small></div>').join("")+'<div class="card"><h3>Nuevo tipo</h3><div class="g2"><input id="tn" placeholder="Nombre"><input id="ts" placeholder="slug"></div><button class="btn p" data-a="createType" style="margin-top:10px">Crear tipo</button></div>';
}
function plansPanel(){
 return '<h1>Planes</h1><p class="sub">Precios y capacidades globales de CitaGo</p>'+(plans.length?plans.map(p=>'<div class="card"><div class="row" style="justify-content:space-between"><h2>'+esc(p.name)+'</h2><b>'+money(p.price_cop)+'</b></div><p class="muted">Profesionales: '+(p.max_professionals??"Ilimitados")+' · Prueba: '+p.trial_days+' días</p><div class="row"><span class="tag">'+(p.whatsapp_enabled?"WhatsApp":"Sin WhatsApp")+'</span><span class="tag">'+(p.reports_enabled?"Reportes":"Sin reportes")+'</span></div></div>').join(""):'<div class="card"><b>El frontend está listo.</b><p class="muted">Para cargar planes aquí falta instalar los endpoints de Plataforma que no venían en el ZIP anterior.</p></div>');
}
function render(){
 document.getElementById("app").innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="wrap">'+(error?'<div class="err">'+esc(error)+'</div>':'')+(loading?'<div class="card">Cargando...</div>':view==="businesses"?businessPanel():view==="types"?typesPanel():plansPanel())+'</div></main></div>';
}
document.getElementById("app").addEventListener("click",e=>{
 const n=e.target.closest("[data-v]");if(n){view=n.dataset.v;render();return}
 const a=e.target.closest("[data-a]");if(a&&a.dataset.a==="createBusiness")createBusiness();
 if(a&&a.dataset.a==="createType")createType();
 const tg=e.target.closest("[data-toggle]");if(tg)toggleBusiness(tg.dataset.toggle,tg.dataset.active==="1");
 const pl=e.target.closest("[data-plan]");if(pl)assignPlan(pl.dataset.plan);
});
load();
</script></body></html>
