<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<script>
// Remove only legacy NUVALITE data; never restore a persistent access token.
(function () {
  ['nuvalite_access_token', 'nuvalite_session', 'citago_demo_final_v1'].forEach(function (key) {
    try { window.localStorage.removeItem(key); } catch (error) { /* Storage can be disabled. */ }
  });
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CitaGo · Plataforma</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"><style>
:root{
  --bg:#fbf5f7;--sf:#fff;--ink:#251c2c;--mut:#746a7a;--line:#eadfe5;
  --acc:#6d5bd0;--side:#251d45;--ok:#16794c;--warn:#9a6200;--bad:#b3372a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:20px 12px}
.side h2{font:700 1.25rem Georgia,serif;margin:0 8px 18px}
.side button{display:block;width:100%;border:0;background:none;color:#fff;opacity:.78;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}
.side button.on{background:rgba(255,255,255,.14);opacity:1;font-weight:800}
.main{padding:24px;min-width:0}
.wrap{max-width:1000px;margin:auto}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.kpi b{display:block;font-size:1.8rem}.kpi span{color:var(--mut);font-size:.82rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:8px 12px;font-weight:700}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{border-color:#efb2aa;color:var(--bad)}
.item{border:1px solid var(--line);background:var(--sf);border-radius:14px;padding:12px;margin:8px 0}
.item small{display:block;color:var(--mut)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:.75rem;font-weight:800;background:#e4f4eb;color:var(--ok)}
.tag.w{background:#fff0d6;color:var(--warn)}.tag.x{background:#fbe0dd;color:var(--bad)}
.muted{color:var(--mut)}
.err{background:#fbe0dd;color:var(--bad);padding:10px;border-radius:10px}
.ok{background:#e4f4eb;color:var(--ok);padding:10px;border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem}
.loading{opacity:.7}
.authScreen{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#eee9ff 0,#fbf5f7 48%,#fbf5f7 100%)}
.authCard{width:min(100%,420px);background:var(--sf);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 70px -42px #251d45}
.authLogo{width:62px;height:62px;border-radius:18px;background:var(--side);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font:700 1.6rem Georgia,serif}
.authCard h1{text-align:center;margin-bottom:4px}.authCard .sub{text-align:center;margin-bottom:20px}
.authCard .btn{width:100%;margin-top:14px;padding:11px 14px}
.authMeta{text-align:center;color:var(--mut);font-size:.78rem;margin-top:14px}
.sideUser{margin:18px 8px 4px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:.78rem;opacity:.9}
.sideUser b{display:block;font-size:.82rem;margin-bottom:6px}
.hero{max-width:520px;margin:28px auto;background:var(--sf);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -35px #6d5bd0}
.heroHead{text-align:center;padding:30px;background:linear-gradient(180deg,#eee9ff,#fff)}
.mark{width:74px;height:74px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;margin:auto;font:700 2rem Georgia,serif;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.heroBody{padding:18px}
.choice{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0;background:#fff}
.choice .ico{font-size:1.4rem;width:36px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px}
.slots button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{
    position:sticky;top:0;z-index:20;padding:8px;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:6px;overflow:visible;align-items:stretch
  }
  .side h2,.sideUser{display:none}
  .side button{
    width:100%;margin:0;padding:10px 6px;
    text-align:center;white-space:normal;font-size:.78rem
  }
  .main{padding:14px}
  .wrap{max-width:100%}
  .card{padding:12px;border-radius:14px}
  .g2,.g3{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(2,1fr)}
  h1{font-size:1.55rem}

}
@media(max-width:420px){
  .side{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.business-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.business-row .row{min-width:0}
.business-row strong,.business-editor h2{overflow-wrap:anywhere}
.business-row .tag,.business-row .btn{flex-shrink:0}
.business-editor .plan-actions{flex-wrap:wrap}
.business-editor .btn:disabled{opacity:.5;cursor:default}
.business-editor [role=status]:empty{display:none}
.business-links{margin-top:16px}

.plan-summary{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.plan-summary h2{margin-top:0}.plan-summary ul{padding-left:20px;margin-bottom:0}
.plan-summary .btn{flex-shrink:0}
.plan-dialog{width:min(560px,calc(100% - 32px));max-height:90dvh;overflow:auto;border:0;border-radius:18px;padding:24px;color:var(--text,#172033)}
.plan-dialog::backdrop{background:rgba(15,23,42,.55)}
.plan-dialog h2{margin-top:0;outline:none}.plan-dialog fieldset{min-width:0}
.plan-dialog input,.plan-dialog select,.plan-dialog textarea{font-size:16px}
.plan-dialog{box-sizing:border-box;max-width:calc(100vw - 32px)}
.plan-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.plan-features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.plan-features label{margin:0}
@media(max-width:480px){.plan-dialog{padding:18px}.plan-features{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div><script>
const API=(location.hostname==="127.0.0.1"||location.hostname==="localhost")
 ? "http://127.0.0.1:8000"
 : "https://citago-backend.onrender.com";

const PUBLIC_CLIENT_BASE=
 (location.hostname==="127.0.0.1"||location.hostname==="localhost")
 ? location.origin+"/cliente.html?biz="
 : "https://citalite.nuvalite.com/cliente.html?biz=";

function clientPublicUrl(slug){
 return PUBLIC_CLIENT_BASE+encodeURIComponent(slug||"");
}

function openClientPage(slug){
 window.open(clientPublicUrl(slug),"_blank","noopener,noreferrer");
}

async function copyClientLink(slug){
 const url=clientPublicUrl(slug);
 try{
  await navigator.clipboard.writeText(url);
  alert("Enlace copiado:\n"+url);
 }catch(_){
  prompt("Copia este enlace:",url);
 }
}

const BUSINESS_PANEL_BASE=
 (location.hostname==="127.0.0.1"||location.hostname==="localhost")
 ? location.origin+"/negocio.html?id="
 : "https://citalite.nuvalite.com/negocio.html?id=";

function businessPanelUrl(id){
 return BUSINESS_PANEL_BASE+encodeURIComponent(id||"");
}

function openBusinessPanel(id){
 window.open(businessPanelUrl(id),"_blank","noopener,noreferrer");
}

async function copyBusinessLink(id){
 const url=businessPanelUrl(id);
 try{
  await navigator.clipboard.writeText(url);
  alert("Enlace del negocio copiado:\n"+url);
 }catch(_){
  prompt("Copia este enlace del negocio:",url);
 }
}

let view="businesses",businesses=[],types=[],plans=[],error="",loading=false;
let authToken=sessionStorage.getItem("citago_platform_token")||"";
let authUser=null,authLoading=true,loginBusy=false,loginError="",loginEmail="";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-CO");
const dateCO=value=>{
 if(!value)return "";
 const d=new Date(value);
 if(Number.isNaN(d.getTime()))return "";
 return d.toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit",year:"numeric",timeZone:"America/Bogota"});
};
const subscriptionLabel=status=>({
 TRIAL:"Prueba",
 ACTIVE:"Activo",
 PAST_DUE:"Pago pendiente",
 SUSPENDED:"Suspendido",
 CANCELLED:"Cancelado"
}[status]||status||"");

function clearSession(renderNow=true){
 authToken="";authUser=null;
 sessionStorage.removeItem("citago_platform_token");
 if(renderNow)render();
}

async function api(path,opts={}){
 const headers=new Headers(opts.headers||{});
 if(authToken)headers.set("Authorization","Bearer "+authToken);
 const r=await fetch(API+path,{...opts,headers});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){
  if(r.status===401&&path!=="/auth/login"){
   authToken="";authUser=null;
   sessionStorage.removeItem("citago_platform_token");
   loginError="Tu sesión venció. Inicia sesión nuevamente.";
  }
  throw new Error(d.detail||"HTTP "+r.status);
 }
 return d;
}

async function loginPlatform(){
 const email=document.getElementById("loginEmail")?.value.trim()||"";
 const password=document.getElementById("loginPassword")?.value||"";
 loginEmail=email;loginError="";
 if(!email||!password){loginError="Ingresa tu correo y contraseña.";render();return}
 loginBusy=true;render();
 try{
  const r=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||"No fue posible iniciar sesión.");
  if(!d.access_token||d.user?.global_role!=="SUPER_ADMIN")throw new Error("Esta cuenta no tiene acceso a Plataforma CitaGo.");
  authToken=d.access_token;
  sessionStorage.setItem("citago_platform_token",authToken);
  const me=await api("/auth/me");
  if(me.global_role!=="SUPER_ADMIN")throw new Error("Esta cuenta no tiene acceso a Plataforma CitaGo.");
  authUser=me;loginError="";
  await load();
 }catch(e){
  clearSession(false);
  loginError=e.message;
 }finally{loginBusy=false;authLoading=false;render()}
}

function logoutPlatform(){
 loginError="";error="";businessMessage="";businesses=[];types=[];plans=[];
 clearSession();
}

async function initAuth(){
 if(!authToken){authLoading=false;render();return}
 try{
  const me=await api("/auth/me");
  if(me.global_role!=="SUPER_ADMIN")throw new Error("Esta cuenta no tiene acceso a Plataforma CitaGo.");
  authUser=me;
  await load();
 }catch(e){
  clearSession(false);
  if(!loginError)loginError=e.message;
 }finally{authLoading=false;render()}
}
async function load(){
 loading=true;error="";render();
 try{
  businesses=await api("/businesses");
  types=await api("/business-types");
  plansError="";
  try{plans=await api("/platform/plans")}catch(e){plans=[];plansError="No se pudieron cargar los planes. "+e.message}
 }catch(e){error=e.message}finally{loading=false;render()}
}
async function createBusiness(){
 const name=document.getElementById("bn").value.trim(),slug=document.getElementById("bs").value.trim(),type=document.getElementById("bt").value;
 if(!name||!slug||!type)return alert("Completa nombre, slug y tipo.");
 await api("/businesses",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({business_type_id:type,name,slug,tagline:null,primary_color:"#6d5bd0",whatsapp:null,email:null,address:null,booking_mode:"AUTO",default_open_time:"08:00",default_close_time:"18:00",slot_minutes:30})});load();
}
async function createType(){
 const name=document.getElementById("tn").value.trim(),slug=document.getElementById("ts").value.trim();
 if(!name||!slug)return alert("Completa nombre y slug.");
 await api("/business-types",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,slug,icon:"📅",color:"#6d5bd0",professional_singular:"profesional",professional_plural:"Profesionales",notes_label:"Notas",notes_placeholder:"",default_open_time:"08:00",default_close_time:"18:00",default_slot_minutes:30})});load();
}
let businessSaving=false,businessMessage="";

function businessChanges(form,business){
 const isActive=form.elements.is_active.value==="true";
 const planId=form.elements.plan_id.value;
 return {
  isActive,
  activeChanged:isActive!==(business.is_active!==false),
  plan:planId!==String(business.plan_id||"")?plans.find(plan=>String(plan.id)===planId):null
 };
}
function updateBusinessSaveButton(form,business){
 const {activeChanged,plan}=businessChanges(form,business);
 form.querySelector('[type="submit"]').disabled=businessSaving||(!activeChanged&&!plan);
}
function focusBusinessEdit(id){
 document.getElementById("edit-business-"+id)?.focus({preventScroll:true});
}
async function saveBusiness(form,business){
 if(businessSaving||!form.reportValidity())return;
 const {isActive,activeChanged,plan}=businessChanges(form,business);
 if(!activeChanged&&!plan)return;

 const controls=form.querySelector("fieldset");
 const feedback=form.querySelector("[role=status]");
 const url="/platform/businesses/"+encodeURIComponent(business.id);
 const headers={"Content-Type":"application/json"};
 businessSaving=true;
 controls.disabled=true;
 feedback.textContent="Guardando…";
 let activeSaved=false;
 try{
  if(activeChanged){
   const result=await api(url+"/active",{method:"PATCH",headers,body:JSON.stringify({is_active:isActive})});
   business.is_active=result.is_active;
   activeSaved=true;
  }
  if(plan){
   const status=Number(plan.trial_days||0)>0?"TRIAL":"ACTIVE";
   const result=await api(url+"/subscription",{
    method:"PUT",headers,body:JSON.stringify({plan_id:plan.id,status})
   });
   Object.assign(business,{plan_id:result.plan_id,plan_name:plan.name,subscription_status:result.status,trial_ends_at:null});
  }
 }catch(e){
  if(!authUser)render();
  else feedback.textContent=(activeSaved?"Estado guardado. No se pudo guardar el plan. ":"No se pudieron guardar los cambios. ")+e.message;
  return;
 }finally{
  businessSaving=false;
  controls.disabled=false;
  updateBusinessSaveButton(form,business);
 }
 businessMessage="Negocio "+business.name+" actualizado.";
 if(plan)await load();
 else render();
 focusBusinessEdit(business.id);
}
function nav(){return '<aside class="side"><h2>CitaGo</h2><button data-v="businesses" class="'+(view==="businesses"?"on":"")+'">🏢 Negocios</button><button data-v="types" class="'+(view==="types"?"on":"")+'">🧩 Tipos</button><button data-v="plans" class="'+(view==="plans"?"on":"")+'">💎 Planes</button><div class="sideUser"><b>'+esc(authUser?.full_name||"Administrador")+'</b><span>'+esc(authUser?.email||"")+'</span></div><button data-a="logout">↪ Cerrar sesión</button></aside>'}
function businessPanel(){
 const rows=businesses.map(b=>{
  const active=b.is_active!==false;
  return '<div class="card business-row"><div class="row"><strong>'+esc(b.name)+'</strong>'+
   '<span class="tag'+(active?'':' x')+'">'+(active?'Activo':'Inactivo')+'</span></div>'+
   '<button class="btn" id="edit-business-'+esc(b.id)+'" data-edit-business="'+esc(b.id)+'" aria-label="Editar '+esc(b.name)+'">Editar</button></div>';
 }).join("");
 return '<h1>Negocios</h1><p class="sub">Administración central</p>'+
  (businessMessage?'<p role="status">'+esc(businessMessage)+'</p>':'')+
  (rows||'<div class="card">No hay negocios registrados.</div>')+
  '<div class="card"><h3>Nuevo negocio</h3><label>Nombre</label><input id="bn" placeholder="Ej. Colegio Público"><label>Slug</label><input id="bs" placeholder="colegio-publico"><label>Tipo</label><select id="bt"><option value="">Selecciona…</option>'+types.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join("")+'</select><button class="btn p" data-a="createBusiness" style="margin-top:10px">Crear negocio</button></div>';
}

function openBusinessEditor(business){
 const active=business.is_active!==false;
 const currentPlanId=String(business.plan_id||"");
 const currentPlanName=business.plan_name||"Plan actual";
 const hasCurrentPlan=plans.some(plan=>String(plan.id)===currentPlanId);
 const planOptions=(currentPlanId&&!hasCurrentPlan
  ? '<option value="'+esc(currentPlanId)+'" selected>'+esc(currentPlanName)+'</option>'
  : currentPlanId?'':'<option value="" selected>Sin plan asignado</option>')+
  plans.map(plan=>'<option value="'+esc(plan.id)+'"'+(String(plan.id)===currentPlanId?' selected':'')+'>'+esc(plan.name)+' · '+money(plan.price_cop)+'</option>').join("");
 const trialEnd=business.subscription_status==="TRIAL"&&business.trial_ends_at
  ?" · vence "+dateCO(business.trial_ends_at):"";
 const subscription=subscriptionLabel(business.subscription_status);
 const app=document.getElementById("app");
 app.insertAdjacentHTML("beforeend",
  '<dialog class="plan-dialog business-editor" id="business-editor" aria-labelledby="business-editor-title">'+
  '<form><h2 id="business-editor-title" tabindex="-1" autofocus>'+esc(business.name)+'</h2>'+
  '<p class="muted">Slug: '+esc(business.slug)+'<br>Tipo: '+esc(business.business_type_name||business.business_type_id||"—")+'</p>'+
  '<fieldset style="border:0;padding:0;margin:0">'+
  '<label>Estado del negocio<select name="is_active"><option value="true"'+(active?' selected':'')+'>Activo</option><option value="false"'+(active?'':' selected')+'>Inactivo</option></select></label>'+
  '<label>Plan<select name="plan_id"'+(plans.length?'':' disabled')+'>'+planOptions+'</select></label>'+
  (subscription?'<small class="muted">'+esc(currentPlanName+' · '+subscription+trialEnd)+'</small>':'')+
  (plansError?'<p class="muted">'+esc(plansError)+'</p>':'')+
  '<div class="row business-links"><button class="btn" type="button" data-open-client="'+esc(business.slug)+'">Abrir cliente</button>'+
  '<button class="btn" type="button" data-copy-client="'+esc(business.slug)+'">Copiar cliente</button>'+
  '<button class="btn" type="button" data-open-business="'+esc(business.id)+'">Abrir negocio</button>'+
  '<button class="btn" type="button" data-copy-business="'+esc(business.id)+'">Copiar negocio</button></div>'+
  '<div class="plan-actions"><button class="btn" type="button" data-cancel-business>Cancelar</button>'+
  '<button class="btn p" type="submit" disabled>Guardar</button></div></fieldset>'+
  '<p class="muted" role="status"></p></form></dialog>');
 const dialog=document.getElementById("business-editor");
 const form=dialog.querySelector("form");
 const cancel=()=>{
  if(businessSaving)return;
  const row=document.getElementById("edit-business-"+business.id)?.closest(".business-row");
  if(row){
   const active=business.is_active!==false;
   const tag=row.querySelector(".tag");
   tag.textContent=active?"Activo":"Inactivo";
   tag.classList.toggle("x",!active);
  }
  dialog.close();
  dialog.remove();
  focusBusinessEdit(business.id);
 };
 form.addEventListener("change",()=>updateBusinessSaveButton(form,business));
 form.addEventListener("submit",event=>{event.preventDefault();saveBusiness(form,business)});
 dialog.querySelector("[data-cancel-business]").addEventListener("click",cancel);
 dialog.addEventListener("cancel",event=>{event.preventDefault();cancel()});
 dialog.showModal();
}

function typesPanel(){
 return '<h1>Tipos de negocio</h1><p class="sub">La plantilla define vocabulario y valores base; cada negocio crea sus servicios.</p>'+types.map(t=>'<div class="item"><b>'+esc(t.icon||"📅")+' '+esc(t.name)+'</b><small>'+esc(t.slug)+' · '+esc(t.professional_plural||"Profesionales")+' · '+t.default_slot_minutes+' min</small></div>').join("")+'<div class="card"><h3>Nuevo tipo</h3><div class="g2"><input id="tn" placeholder="Nombre"><input id="ts" placeholder="slug"></div><button class="btn p" data-a="createType" style="margin-top:10px">Crear tipo</button></div>';
}
const planFeatures={
 whatsapp_enabled:"WhatsApp",
 reports_enabled:"Reportes",
 payments_enabled:"Pagos",
 multi_location_enabled:"Múltiples sedes"
};
let planSaving=false,planMessage="",plansError="",editingPlanId=null;

async function savePlan(form){
 if(planSaving||!form.reportValidity())return;
 const fields=new FormData(form);
 const max=fields.get("max_professionals");
 const changes={
  price_cop:Number(fields.get("price_cop")),
  trial_days:Number(fields.get("trial_days")),
  max_professionals:max===""?null:Number(max)
 };
 for(const key of Object.keys(planFeatures))changes[key]=fields.has(key);
 const plan=plans.find(item=>item.id===form.dataset.editPlan);
 if(!plan)return;
 const patch=Object.fromEntries(Object.entries(changes).filter(([key,value])=>plan[key]!==value));
 const feedback=form.querySelector("[role=status]");
 if(!Object.keys(patch).length){feedback.textContent="No hay cambios para guardar.";return}
 const controls=form.querySelector("fieldset");
 planSaving=true;
 controls.disabled=true;
 feedback.textContent="Guardando…";
 try{
  await api("/platform/plans/"+encodeURIComponent(plan.id),{
   method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)
  });
  Object.assign(plan,patch);
  planMessage="Plan "+plan.name+" actualizado.";
  editingPlanId=null;
  render();
  document.querySelector('[data-edit-plan-button="'+plan.id+'"]')?.focus();
 }catch(e){
  if(!authUser)render();
  else feedback.textContent="No se pudo guardar. "+e.message;
 }finally{
  planSaving=false;
  controls.disabled=false;
 }
}

function planFields(plan){
 const features=Object.entries(planFeatures).map(([key,label])=>
  '<label><input style="width:auto" type="checkbox" name="'+key+'"'+(plan[key]?' checked':'')+'> '+label+'</label>'
 ).join("");
 return '<form data-edit-plan="'+esc(plan.id)+'"><h2 tabindex="-1" autofocus>'+esc(plan.name)+'</h2>'+
  '<fieldset style="border:0;padding:0;margin:0">'+
  '<label>Precio mensual (COP)<input name="price_cop" type="number" min="0" step="1" required value="'+esc(plan.price_cop)+'"></label>'+
  '<label>Días de prueba<input name="trial_days" type="number" min="0" step="1" required value="'+esc(plan.trial_days)+'"></label>'+
  '<label>Límite de profesionales (vacío = sin límite)<input name="max_professionals" type="number" min="1" step="1" value="'+esc(plan.max_professionals)+'"></label>'+
  '<div class="plan-features">'+features+'</div><div class="plan-actions"><button class="btn" type="button" data-a="cancelPlan">Cancelar</button><button class="btn p" type="submit">Guardar cambios</button></div></fieldset>'+
  '<p class="muted" role="status"></p></form>';
}

function planSummary(plan){
 const included=Object.entries(planFeatures).filter(([key])=>plan[key]).map(([,label])=>'<li>'+label+'</li>').join("");
 return '<section class="card plan-summary"><div><h2>'+esc(plan.name)+'</h2><b>'+money(plan.price_cop)+' / mes</b>'+
  '<ul><li>'+esc(plan.max_professionals==null?'Profesionales sin límite':plan.max_professionals+' profesional(es)')+'</li>'+
  (plan.trial_days?'<li>'+esc(plan.trial_days)+' días de prueba</li>':'')+included+'</ul></div>'+
  '<button class="btn" data-edit-plan-button="'+esc(plan.id)+'">Editar</button></section>';
}
function closePlanEditor(){
 if(planSaving)return;
 const id=editingPlanId;
 editingPlanId=null;
 render();
 document.querySelector('[data-edit-plan-button="'+id+'"]')?.focus();
}
function plansPanel(){
 return '<h1>Planes</h1><p class="sub">Precios y funciones del catálogo de CitaGo</p>'+
  (planMessage?'<p role="status">'+esc(planMessage)+'</p>':'')+
  (plansError?'<div class="err">'+esc(plansError)+' <button class="btn" data-a="reloadPlans">Reintentar</button></div>':
   plans.length?plans.map(planSummary).join(""):'<div class="card">No hay planes registrados.</div>')+
  (editingPlanId?'<dialog class="plan-dialog" id="plan-dialog" aria-label="Editar plan">'+planFields(plans.find(p=>p.id===editingPlanId))+'</dialog>':'');
}
function loginView(){
 return '<div class="authScreen"><div class="authCard"><div class="authLogo">CG</div><h1>Plataforma CitaGo</h1><p class="sub">Acceso administrativo</p>'+(loginError?'<div class="err">'+esc(loginError)+'</div>':'')+'<form id="loginForm"><label>Correo</label><input id="loginEmail" type="email" autocomplete="username" value="'+esc(loginEmail)+'" placeholder="correo@ejemplo.com" required><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Tu contraseña" required><button class="btn p" type="submit" '+(loginBusy?'disabled':'')+'>'+(loginBusy?'Ingresando…':'Iniciar sesión')+'</button></form><div class="authMeta">Acceso exclusivo para administración de CitaGo</div></div></div>';
}
function render(){
 const app=document.getElementById("app");
 if(authLoading){app.innerHTML='<div class="authScreen"><div class="authCard"><h1>Plataforma CitaGo</h1><p class="sub">Validando sesión…</p></div></div>';return}
 if(!authUser){app.innerHTML=loginView();return}
 app.innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="wrap">'+(error?'<div class="err">'+esc(error)+'</div>':'')+(loading?'<div class="card">Cargando...</div>':view==="businesses"?businessPanel():view==="types"?typesPanel():plansPanel())+'</div></main></div>';
}
document.getElementById("app").addEventListener("submit",e=>{
 if(e.target.id==="loginForm"){e.preventDefault();loginPlatform()}
 if(e.target.matches("[data-edit-plan]")){e.preventDefault();savePlan(e.target)}
});
document.getElementById("app").addEventListener("click",e=>{
 const n=e.target.closest("[data-v]");if(n){if(!planSaving){view=n.dataset.v;editingPlanId=null;planMessage="";render()}return}
 const edit=e.target.closest("[data-edit-plan-button]");
 if(edit){
  editingPlanId=edit.dataset.editPlanButton;
  render();
  const dialog=document.getElementById("plan-dialog");
  dialog.showModal();
  dialog.addEventListener("cancel",event=>{event.preventDefault();closePlanEditor()});
  return;
 }
 const a=e.target.closest("[data-a]");
 if(a&&a.dataset.a==="cancelPlan"){closePlanEditor();return}
 if(a&&a.dataset.a==="logout"){logoutPlatform();return}
 if(a&&a.dataset.a==="reloadPlans"){load();return}
 if(a&&a.dataset.a==="createBusiness")createBusiness();
 if(a&&a.dataset.a==="createType")createType();
 const openClient=e.target.closest("[data-open-client]");
 if(openClient){openClientPage(openClient.dataset.openClient);return}
 const copyClient=e.target.closest("[data-copy-client]");
 if(copyClient){copyClientLink(copyClient.dataset.copyClient);return}
 const openBusiness=e.target.closest("[data-open-business]");
 if(openBusiness){openBusinessPanel(openBusiness.dataset.openBusiness);return}
 const copyBusiness=e.target.closest("[data-copy-business]");
 if(copyBusiness){copyBusinessLink(copyBusiness.dataset.copyBusiness);return}
 const editBusiness=e.target.closest("[data-edit-business]");
 if(editBusiness){
  const business=businesses.find(b=>String(b.id)===editBusiness.dataset.editBusiness);
  if(business)openBusinessEditor(business);
 }
});
initAuth();
</script></body></html>
