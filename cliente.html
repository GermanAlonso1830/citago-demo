<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservas · Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#fbf8f7;--sf:#fff;--ink:#2f2b2a;--mut:#77706d;--line:#ece4e1;
  --acc:#b98888;--acc-soft:#f5eaea;--ok:#19764d;--warn:#9a6200;--bad:#b3372a;
  --shadow:0 18px 45px rgba(55,38,36,.10);
  --title-font:"Playfair Display",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding-top:75px;background:linear-gradient(rgba(255,250,248,.90),rgba(255,250,248,.90)),var(--site-bg-image,none) center/cover fixed,var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
body.modalOpen{overflow:hidden}

.siteHeader{position:fixed;top:0;left:0;right:0;z-index:60;width:100%;background:rgba(255,250,248,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(236,228,225,.9)}
.headerInner{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
 .brandMark{width:46px;height:46px;border-radius:14px;background:#fff;color:var(--acc);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:0 0 auto;box-shadow:0 8px 18px rgba(70,40,40,.10);padding:4px}
.brandMark img{width:100%;height:100%;object-fit:contain;object-position:center;border-radius:10px}
.brandName{font-weight:800;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headerSpacer{flex:1}
.navLinks{display:flex;gap:24px;align-items:center;color:#4e4947;font-size:.95rem}
.navLinks a:hover{color:var(--acc)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;transition:.2s ease}
.btn:hover{transform:translateY(-1px)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.btn.full{width:100%}
.menuBtn{display:none;border:0;background:transparent;font-size:1.7rem;padding:6px}

.hero{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.05fr .95fr;min-height:640px;align-items:stretch}
.heroCopy{padding:80px 42px 70px 24px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-self:flex-start;padding:9px 14px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.hero h1{font:600 clamp(3rem,6vw,5.8rem)/.98 var(--title-font);margin:28px 0 24px;letter-spacing:-.03em}
.hero h1 em{color:var(--acc);font-weight:600}
.hero p{font-size:1.12rem;line-height:1.8;color:var(--mut);max-width:610px;margin:0 0 30px}
.heroActions{display:flex;gap:12px;flex-wrap:wrap}
.heroActions .btn{padding:14px 22px;border-radius:999px}
.heroImage{min-height:640px;background:linear-gradient(145deg,var(--acc-soft),#efe5e0);position:relative;overflow:hidden;isolation:isolate}
.heroImage.hasImage{background:linear-gradient(145deg,#f8f3f1,#eee7e3)}
.heroImage.hasImage::before{content:none}
.heroMainImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:1;background:transparent}
.heroImage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,10,.02),rgba(20,10,10,.15));z-index:2;pointer-events:none}
.heroImageBadge{position:absolute;right:24px;bottom:24px;z-index:3;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;font-size:1.55rem;box-shadow:var(--shadow)}

.section{max-width:1180px;margin:auto;padding:84px 24px;scroll-margin-top:130px}
.sectionHead{text-align:center;max-width:700px;margin:0 auto 38px}
.sectionHead .eyebrow{align-self:auto}
.sectionHead h2{font:600 clamp(2.2rem,4vw,3.6rem)/1.08 var(--title-font);margin:18px 0 12px}
.sectionHead p{color:var(--mut);margin:0;font-size:1.04rem}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:-34px;position:relative;z-index:2}
.feature{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 14px 34px rgba(50,35,33,.05)}
.featureIcon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-size:1.15rem;margin-bottom:12px}
.feature b{display:block;margin-bottom:4px}.feature span{color:var(--mut);font-size:.93rem}

.serviceGrid{display:grid;grid-template-columns:1fr;gap:12px}
.serviceCard{display:grid;grid-template-columns:124px minmax(145px,1.05fr) minmax(230px,2fr) 86px 110px auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px 12px;box-shadow:0 10px 26px rgba(50,35,33,.035);transition:transform .18s ease,box-shadow .18s ease}
.serviceCard:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(50,35,33,.06)}
.serviceVisual{width:124px;height:86px;border-radius:13px;background:linear-gradient(145deg,var(--acc-soft),#f0ebe9);display:grid;place-items:center;font-size:2.3rem;overflow:hidden}
.serviceVisual img{width:100%;height:100%;object-fit:cover;object-position:center}
.serviceName{min-width:0}.serviceName h3{margin:0;font-size:1rem;line-height:1.3}
.serviceDesc{color:var(--mut);font-size:.88rem;line-height:1.45;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.price{font-weight:800;color:var(--acc);white-space:nowrap}
.serviceCard .btn{justify-self:end;white-space:nowrap}
.teamGrid{display:grid;grid-template-columns:1fr;gap:12px}
.person{display:grid;grid-template-columns:104px minmax(155px,1.05fr) minmax(160px,1fr) minmax(220px,1.8fr) auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px 12px;box-shadow:0 10px 26px rgba(50,35,33,.035);transition:transform .18s ease,box-shadow .18s ease}
.person:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(50,35,33,.06)}

.personPhoto img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.personName{min-width:0}.personName h3{margin:0;font-size:1rem;line-height:1.3}

.contactCard{display:grid;grid-template-columns:1.15fr .85fr;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.contactCopy{padding:38px}.contactCopy h2{font:600 2.5rem/1.1 "Playfair Display",serif;margin:0 0 14px}.contactCopy p{color:var(--mut)}
.contactAside{background:var(--acc-soft);padding:38px;display:grid;align-content:center;gap:12px}
.contactLine{display:flex;gap:12px;align-items:flex-start}.contactLine b{display:block}.contactLine span{color:var(--mut);font-size:.92rem}
.footer{padding:28px 24px;text-align:center;color:var(--mut);font-size:.86rem}

.overlay{position:fixed;inset:0;z-index:80;background:rgba(35,28,26,.45);display:flex;justify-content:flex-end;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.bookingPanel{width:min(520px,100%);height:100%;background:#fff;box-shadow:-18px 0 50px rgba(20,10,10,.15);display:flex;flex-direction:column;animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(18px);opacity:.6}to{transform:none;opacity:1}}
.panelHead{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
.panelHead h2{margin:0;font-size:1.25rem}.closeBtn{border:0;background:none;font-size:1.6rem;color:var(--mut);padding:4px}
.panelBody{padding:22px;overflow:auto;flex:1}
.panelFoot{padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:#fff}
.panelFoot .btn{flex:1;min-height:48px}
.choice{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;background:#fff;width:100%;text-align:left}
.choice:hover{border-color:color-mix(in srgb,var(--acc) 55%, var(--line));background:#fffdfc}
.choice .thumb{width:62px;height:62px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;font-size:1.5rem;overflow:hidden;flex:0 0 auto}
.choice .thumb img{width:100%;height:100%;object-fit:cover;object-position:center 22%}.choice b{display:block}.choice small{display:block;color:var(--mut);margin-top:3px}
.stepTitle{font:600 1.8rem/1.15 "Playfair Display",serif;margin:0 0 8px}.stepSub{color:var(--mut);margin:0 0 20px}
label{display:block;font-size:.83rem;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.slots button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px}
.slots button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.summary{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fffdfc;margin-bottom:16px}
.summaryRow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}.summaryRow:last-child{border-bottom:0}.summaryRow span{color:var(--mut)}
.err{background:#fbe0dd;color:var(--bad);padding:11px 12px;border-radius:12px;margin-bottom:14px}.ok{background:#e4f4eb;color:var(--ok);padding:11px 12px;border-radius:12px;margin-bottom:14px}
.tag{display:inline-block;border-radius:999px;padding:4px 9px;font-size:.75rem;font-weight:800;background:#e4f4eb;color:var(--ok)}
.tag.w{background:#fff0d6;color:var(--warn)}.tag.x{background:#fbe0dd;color:var(--bad)}
.item{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;margin:10px 0}.apptMeta{display:grid;gap:5px;margin-top:8px}.apptMeta span{color:var(--mut);font-size:.9rem}
.muted{color:var(--mut)}.devHint{margin:10px 0 0;padding:9px 10px;border-radius:10px;background:#faf7ff;color:var(--mut);font-size:.78rem}

/* Teléfono internacional: prefijo de país + número local */
.phoneField{display:grid;grid-template-columns:minmax(138px,42%) minmax(0,1fr);gap:8px;align-items:center}
.phoneField select,.phoneField input{margin:0;min-width:0}
.phoneField select{font-weight:700}
.phoneHelp{display:block;margin-top:5px;color:var(--mut);font-size:.76rem;line-height:1.35}
@media(max-width:390px){
  .phoneField{grid-template-columns:minmax(126px,44%) minmax(0,1fr);gap:7px}
  .phoneField select,.phoneField input{padding-left:10px;padding-right:10px}
}

.loadingPage{min-height:100vh;display:grid;place-items:center;color:var(--mut)}
.empty{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--mut)}

.mobileMenu{display:none}
@media(max-width:900px){
  .navLinks{display:none}.menuBtn{display:block}.hero{grid-template-columns:1fr}.heroCopy{padding:58px 24px 44px}.heroImage{min-height:420px}.heroMainImage{padding:0}.features{grid-template-columns:1fr;margin-top:20px}.contactCard{grid-template-columns:1fr}.mobileMenu.open{display:block;position:absolute;top:74px;left:14px;right:14px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px}.mobileMenu a,.mobileMenu button{display:block;width:100%;padding:12px;border:0;background:none;text-align:left;font-weight:600}
}
@media(max-width:640px){
  body{padding-top:118px}
  .headerInner{padding:10px 14px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
  .brand{grid-column:1;min-width:0;gap:10px}
  .brandMark{width:54px;height:54px;padding:3px;border-radius:15px}
  .brandName{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.12;font-size:1rem;max-width:none}
  .headerSpacer,.navLinks{display:none}
  .menuBtn{grid-column:2;grid-row:1;display:block;justify-self:end}
  .headerReserve{grid-column:1 / -1;grid-row:2;justify-self:end;padding:7px 12px;border-radius:10px;font-size:.82rem;line-height:1.1;margin-top:0}
  .heroCopy{padding:42px 20px 34px}
  .hero h1{font-size:clamp(2.45rem,11vw,3rem);line-height:1.01;margin:22px 0 20px}
  .heroImage{min-height:320px}.heroMainImage{padding:0}.section{padding:62px 18px}.sectionHead{text-align:left}.sectionHead .eyebrow{align-self:flex-start}.contactCopy,.contactAside{padding:26px}.slots{grid-template-columns:repeat(2,1fr)}.bookingPanel{width:100%}.panelHead{padding:17px 18px}.panelBody{padding:18px}.panelFoot{padding-left:18px;padding-right:18px}
}

@media(max-width:900px){
  .serviceCard{grid-template-columns:108px minmax(130px,1fr) minmax(180px,1.7fr) 74px 95px auto;gap:12px;padding:10px 12px 10px 10px}

}
@media(max-width:700px){
  .serviceCard{grid-template-columns:86px 1fr auto;grid-template-areas:"photo name button" "photo desc desc" "photo meta price";gap:7px 12px;align-items:center;padding:10px}

@media(max-width:900px){
  .person{grid-template-columns:94px minmax(135px,1fr) minmax(140px,1fr) minmax(175px,1.4fr) auto;gap:12px;padding:10px 12px 10px 10px}
  .personPhoto{width:94px;height:72px}
}
@media(max-width:700px){
  .person{grid-template-columns:82px 1fr auto;grid-template-areas:"photo name button" "photo specialty specialty" "photo services services";gap:7px 12px;padding:10px}
  .personPhoto{grid-area:photo;width:82px;height:74px}
  .personName{grid-area:name}
  .personSpecialty{grid-area:specialty}
  .personServices{grid-area:services;-webkit-line-clamp:2}
  .person .btn{grid-area:button;padding:8px 10px}
}
@media(max-width:430px){
  .person{grid-template-columns:74px 1fr;grid-template-areas:"photo name" "photo specialty" "services services" "button button"}
  .personPhoto{width:74px;height:68px}
  .person .btn{justify-self:stretch;width:100%;margin-top:4px}

/* ===== Ajustes de scroll y viewport móvil ===== */
html{
  min-height:100%;
  overflow-x:hidden;
  overflow-x:clip;
  -webkit-text-size-adjust:100%;
}
body{
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  overflow-x:clip;
  overscroll-behavior-y:auto;
  -webkit-overflow-scrolling:touch;
}
#app{
  min-height:100vh;
  min-height:100dvh;
}

/* Cuando no hay modal, la página pública siempre conserva el scroll vertical. */
body:not(.modalOpen){overflow-y:auto}

/* El modal usa el viewport dinámico real del móvil y su cuerpo hace el scroll. */
.overlay{height:100vh;height:100dvh}
.bookingPanel{height:100vh;height:100dvh;max-height:100dvh;min-height:0}
.panelBody{min-height:0;-webkit-overflow-scrolling:touch}

@media(max-width:640px){
  body{
    background-attachment:scroll;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .section{
    width:100%;
    max-width:100%;
  }
  #contacto{padding-bottom:78px}
  .footer{padding-bottom:calc(34px + env(safe-area-inset-bottom,0px))}
}

<body>
<div id="app"></div>
<script>
const API=(location.hostname==="127.0.0.1"||location.hostname==="localhost")?"http://127.0.0.1:8000":"https://citago-backend.onrender.com";
const qs=new URLSearchParams(location.search);
const BUSINESS_SLUG=qs.get("biz")||"";
let business=null,services=[],professionals=[],step=0;
let booking={service:null,professional:null,date:"",time:"",name:"",phoneCountry:"+57",phone:"",email:"",notes:"",reminder:true};
let availability=[],message="",error="",bookingBusy=false;
let view="home",myStep="phone",myPhoneCountry="+57",myPhone="",myToken=sessionStorage.getItem("client_otp_v2:"+BUSINESS_SLUG)||"",myAppointments=[],myBusy=false;
// Legacy phone-only sessions are never reused.
sessionStorage.removeItem("booking_my_token");sessionStorage.removeItem("citago_my_token");
let myMethods=[],myChallenge="",myCode="",myResendAt=0,myGeneration=0;
const myStorageKey="client_otp_v2:"+BUSINESS_SLUG;
let menuOpen=false;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-CO");
const imgOf=obj=>obj?.image_url||obj?.photo_url||obj?.avatar_url||obj?.cover_url||"";

const PHONE_COUNTRIES=[
  {name:"Colombia",flag:"🇨🇴",code:"+57"},
  {name:"Perú",flag:"🇵🇪",code:"+51"},
  {name:"Ecuador",flag:"🇪🇨",code:"+593"},
  {name:"Venezuela",flag:"🇻🇪",code:"+58"},
  {name:"México",flag:"🇲🇽",code:"+52"},
  {name:"Argentina",flag:"🇦🇷",code:"+54"},
  {name:"Chile",flag:"🇨🇱",code:"+56"},
  {name:"Bolivia",flag:"🇧🇴",code:"+591"},
  {name:"Paraguay",flag:"🇵🇾",code:"+595"},
  {name:"Uruguay",flag:"🇺🇾",code:"+598"},
  {name:"Brasil",flag:"🇧🇷",code:"+55"},
  {name:"Panamá",flag:"🇵🇦",code:"+507"},
  {name:"Costa Rica",flag:"🇨🇷",code:"+506"},
  {name:"Guatemala",flag:"🇬🇹",code:"+502"},
  {name:"Honduras",flag:"🇭🇳",code:"+504"},
  {name:"El Salvador",flag:"🇸🇻",code:"+503"},
  {name:"Nicaragua",flag:"🇳🇮",code:"+505"},
  {name:"Rep. Dominicana",flag:"🇩🇴",code:"+1"},
  {name:"Puerto Rico",flag:"🇵🇷",code:"+1"},
  {name:"Cuba",flag:"🇨🇺",code:"+53"},
  {name:"Estados Unidos",flag:"🇺🇸",code:"+1"},
  {name:"Canadá",flag:"🇨🇦",code:"+1"},
  {name:"España",flag:"🇪🇸",code:"+34"},
  {name:"Portugal",flag:"🇵🇹",code:"+351"},
  {name:"Francia",flag:"🇫🇷",code:"+33"},
  {name:"Italia",flag:"🇮🇹",code:"+39"},
  {name:"Alemania",flag:"🇩🇪",code:"+49"},
  {name:"Reino Unido",flag:"🇬🇧",code:"+44"},
  {name:"India",flag:"🇮🇳",code:"+91"}
];
function countryOptions(selected){
  return PHONE_COUNTRIES.map(c=>'<option value="'+esc(c.code)+'" '+(c.code===selected?'selected':'')+'>'+c.flag+' '+esc(c.name)+' '+esc(c.code)+'</option>').join('');
}
function cleanPhoneDigits(raw){return String(raw||"").replace(/\D/g,"")}
function normalizePhone(countryCode,raw){
  const code=cleanPhoneDigits(countryCode||"+57");
  let digits=cleanPhoneDigits(raw);
  if(!digits)return "";
  // Si el usuario escribió el prefijo otra vez en el campo del número, no lo duplicamos.
  if(code&&digits.startsWith(code)&&digits.length-code.length>=7)digits=digits.slice(code.length);
  return "+"+code+digits;
}
function localPhoneDigits(countryCode,raw){
  const code=cleanPhoneDigits(countryCode||"+57");
  let digits=cleanPhoneDigits(raw);
  if(code&&digits.startsWith(code)&&digits.length-code.length>=7)digits=digits.slice(code.length);
  return digits;
}
function phoneFieldHtml(selectId,inputId,countryCode,localValue,placeholder){
  return '<div class="phoneField">'+
    '<select id="'+selectId+'" aria-label="Prefijo del país">'+countryOptions(countryCode||"+57")+'</select>'+
    '<input id="'+inputId+'" inputmode="tel" autocomplete="tel-national" value="'+esc(localValue||"")+'" placeholder="'+esc(placeholder||"Número")+'">'+
  '</div><small class="phoneHelp">Selecciona el prefijo del país y escribe solo el número. La aplicación lo guardará en formato internacional.</small>';
}

function todayInBusinessTz(){
  const tz=(business&&business.timezone)||"America/Bogota";
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value||"";
  return get("year")+"-"+get("month")+"-"+get("day");
}
function clearAvailabilitySelection({clearDate=true}={}){availability=[];booking.time="";if(clearDate)booking.date=""}
async function api(path,opts={}){
  const r=await fetch(API+path,opts);
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.detail||("HTTP "+r.status));
  return data;
}
async function loadBase(){
  try{
    if(!BUSINESS_SLUG)throw new Error("Enlace de reserva inválido. Falta identificar el negocio.");
    const catalog=await api("/public/businesses/"+encodeURIComponent(BUSINESS_SLUG)+"/catalog");
    business=catalog.business;
    services=catalog.services||[];
    professionals=catalog.professionals||[];
    document.documentElement.style.setProperty("--acc",business.primary_color||"#b98888");
    const titleFonts={PLAYFAIR:'"Playfair Display",serif',GEORGIA:'Georgia,serif',SERIF:'Georgia,serif',SANS:'"DM Sans",system-ui,sans-serif',MODERN:'"DM Sans",system-ui,sans-serif'};
    document.documentElement.style.setProperty("--title-font",titleFonts[String(business.title_font||"PLAYFAIR").toUpperCase()]||titleFonts.PLAYFAIR);
    if(business.background_image_url){
      document.documentElement.style.setProperty("--site-bg-image",'url("'+String(business.background_image_url).replace(/"/g,'%22')+'")');
    }else{
      document.documentElement.style.setProperty("--site-bg-image","none");
    }
    if(business.secondary_color)document.documentElement.style.setProperty("--acc-soft",business.secondary_color);
    document.title=(business.name||"Reservas")+" · Reservas";
  }catch(e){error=e.message}
  render();
}
async function loadAvailability(){
  if(!booking.service||!booking.date)return;
  error="";
  try{
    let u="/availability?business_id="+business.id+"&service_id="+booking.service.id+"&date="+booking.date;
    if(booking.professional)u+="&professional_id="+booking.professional.id;
    const x=await api(u);
    availability=x.professionals||[];
  }catch(e){error=e.message;availability=[]}
  render();
}
function eligiblePros(){
  if(!booking.service)return [];
  const sid=booking.service.id;
  return professionals.filter(p=>Array.isArray(p.service_ids)?p.service_ids.includes(sid):true);
}
function currentProfessionalName(){return booking.professional?.name||"Cualquier profesional disponible"}
function fmtShortDate(date){
  if(!date)return "";
  const d=new Date(date+"T12:00:00");
  return new Intl.DateTimeFormat("es-CO",{weekday:"long",day:"numeric",month:"long"}).format(d);
}
function bookingDetailsValid(){
  const digits=localPhoneDigits(booking.phoneCountry,booking.phone);
  const email=booking.email.trim();
  return Boolean(booking.name.trim())&&digits.length>=7&&cleanPhoneDigits(normalizePhone(booking.phoneCountry,booking.phone)).length<=15&&(!email||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
}
function readBookingFields(){
  for(const id of ['name','phoneCountry','phone','email','notes']){
    const el=document.getElementById(id);if(el)booking[id]=el.value;
  }
  const rem=document.getElementById('rem');if(rem)booking.reminder=rem.checked;
}
function updateBookingButton(){
  readBookingFields();
  const button=document.querySelector('[data-a="book"]');
  if(button)button.disabled=bookingBusy||!bookingDetailsValid();
  const help=document.getElementById('bookingDataHelp');
  if(help)help.textContent=bookingDetailsValid()?'Datos completos. Ya puedes confirmar tu cita.':'Completa tu nombre y un teléfono válido. El correo es opcional; si lo escribes, debe ser válido.';
}
async function book(){
  if(bookingBusy)return;
  const normalizedPhone=normalizePhone(booking.phoneCountry,booking.phone);
  const localDigits=localPhoneDigits(booking.phoneCountry,booking.phone);
  if(!bookingDetailsValid()){error="Completa tu nombre, un teléfono válido y revisa el correo si lo ingresaste.";render();return}
  let professionalId=booking.professional?.id||null;
  if(!professionalId){
    const available=availability.find(x=>(x.slots||[]).includes(booking.time));
    professionalId=available?.professional_id||available?.id||null;
  }
  if(!booking.time||!professionalId){error="Selecciona un horario disponible.";render();return}
  bookingBusy=true;error="";render();
  try{
    const x=await api("/appointments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      business_id:business.id,service_id:booking.service.id,professional_id:professionalId,
      client_name:booking.name.trim(),client_phone:normalizedPhone,client_email:booking.email.trim()||null,
      date:booking.date,start_time:booking.time,notes:booking.notes||null,reminder_opt_in:booking.reminder
    })});
    message="Tu cita quedó registrada correctamente. Estado: "+statusLabel(x.appointment.status)+".";
    step=5;
  }catch(e){error=e.message}
  finally{bookingBusy=false;render()}
}
function fmtAppointmentDate(iso){
  const d=new Date(iso);const tz=(business&&business.timezone)||"America/Bogota";
  return new Intl.DateTimeFormat("es-CO",{timeZone:tz,weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true}).format(d);
}
function statusLabel(s){return ({CONFIRMED:"Confirmada",PENDING:"Pendiente",COMPLETED:"Completada",NO_SHOW:"No asistió",CANCELLED:"Cancelada",REJECTED:"Rechazada"})[s]||s}
function statusClass(s){return s==="CONFIRMED"||s==="COMPLETED"?"tag":s==="PENDING"?"tag w":"tag x"}
function clearMyAccess(){
  myGeneration++;myToken="";myAppointments=[];myStep="phone";myChallenge="";myCode="";
  myMethods=[];myBusy=false;sessionStorage.removeItem(myStorageKey);
}
async function identifyMyAppointments(){
  if(myBusy)return;
  myPhoneCountry=document.getElementById("myPhoneCountry").value;
  myPhone=document.getElementById("myPhone").value.trim();
  if(localPhoneDigits(myPhoneCountry,myPhone).length<7){error="Escribe un número válido.";render();return}
  myBusy=true;error="";message="";const generation=myGeneration;render();
  try{
    const x=await api("/public/appointments/otp/options",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({business_id:business.id,phone:normalizePhone(myPhoneCountry,myPhone)})});
    if(generation!==myGeneration)return;
    myMethods=x.methods||[];myStep="method";
  }catch(e){if(generation===myGeneration)error=e.message}
  finally{if(generation===myGeneration){myBusy=false;render()}}
}
async function requestMyCode(){
  if(myBusy||Date.now()<myResendAt)return;
  myBusy=true;error="";message="";const generation=myGeneration;render();
  try{
    const x=await api("/public/appointments/otp/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({business_id:business.id,phone:normalizePhone(myPhoneCountry,myPhone),channel:"email"})});
    if(generation!==myGeneration)return;
    myChallenge=x.challenge_id;myCode="";myResendAt=Date.now()+(x.resend_after_seconds||60)*1000;
    myStep="code";message=x.message;
  }catch(e){if(generation===myGeneration)error=e.message}
  finally{if(generation===myGeneration){myBusy=false;render()}}
}
async function verifyMyCode(){
  if(myBusy)return;
  myCode=(document.getElementById("myCode")?.value||"").trim();
  if(!/^[0-9]{6}$/.test(myCode)){error="Escribe los 6 dígitos del código.";render();return}
  myBusy=true;error="";const generation=myGeneration;render();
  try{
    const x=await api("/public/appointments/otp/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({challenge_id:myChallenge,code:myCode})});
    if(generation!==myGeneration)return;
    myToken=x.access_token;sessionStorage.setItem(myStorageKey,myToken);
    myCode="";myChallenge="";message="";await loadMyAppointments();
  }catch(e){if(generation===myGeneration)error=e.message}
  finally{if(generation===myGeneration){myBusy=false;render()}}
}
async function loadMyAppointments(){
  if(!myToken)return;
  const generation=myGeneration,token=myToken;
  try{
    const x=await api("/public/appointments/my",{headers:{Authorization:"Bearer "+token}});
    if(generation!==myGeneration)return;
    myAppointments=x.appointments||[];myStep="list";
  }catch(e){if(generation===myGeneration){clearMyAccess();error=e.message;render()}throw e}
}

function renderMyAppointments(){
  let h='<h3 class="stepTitle">Mis citas</h3>';
  if(error)h+='<div class="err">'+esc(error)+'</div>';
  if(message&&myStep==="code")h+='<div class="ok" role="status">'+esc(message)+'</div>';
  if(myStep==="phone"){
    h+='<p class="stepSub">Ingresa el número que usaste al reservar, con su país.</p><label>WhatsApp</label>'+phoneFieldHtml("myPhoneCountry","myPhone",myPhoneCountry,myPhone,"Ej. 3001234567")+'<button style="margin-top:12px" class="btn p full" data-a="identifyMy" '+(myBusy?'disabled':'')+'>'+(myBusy?'Consultando…':'Continuar')+'</button>';

    if(!emailAvailable)h+='<p class="muted">No podemos verificar este número por correo. Revisa el país y número o contacta al negocio para validar tus datos.</p>';
    h+='<button class="btn full" data-a="myBack" '+(myBusy?'disabled':'')+'>Cambiar número</button>';
  }else if(myStep==="code"){
    h+='<p class="stepSub">Revisa el correo que usaste al reservar, incluida la carpeta de spam. El código vence en 5 minutos.</p><label for="myCode">Código de 6 dígitos</label><input id="myCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="'+esc(myCode)+'"><button style="margin-top:12px" class="btn p full" data-a="verifyMyCode" '+(myBusy||!/^[0-9]{6}$/.test(myCode)?'disabled':'')+'>'+(myBusy?'Verificando…':'Verificar y ver mis citas')+'</button><button style="margin-top:8px" class="btn full" data-a="requestMyCode" '+(myBusy||Date.now()<myResendAt?'disabled':'')+'>Reenviar código</button><small class="phoneHelp">Puedes solicitar otro código después de 60 segundos.</small><button style="margin-top:8px" class="btn full" data-a="myBack" '+(myBusy?'disabled':'')+'>Cambiar número</button>';
  }else if(myBusy){
    h+='<p role="status">Cargando tus citas…</p>';
  }else{
    if(!myAppointments.length)h+='<div class="empty">No tienes citas registradas.</div>';
    myAppointments.forEach(a=>h+='<div class="item"><div style="display:flex;justify-content:space-between;gap:10px"><b>'+esc(a.service)+'</b><span class="'+statusClass(a.status)+'">'+esc(statusLabel(a.status))+'</span></div><div class="apptMeta"><span>👤 '+esc(a.professional||"Profesional")+'</span><span>📅 '+esc(fmtAppointmentDate(a.start_at))+'</span><span>⏱️ '+esc(a.duration_minutes)+' min</span><span>💰 '+money(a.price)+'</span></div></div>');
    h+='<button class="btn p full" data-a="newBooking">Reservar otra cita</button><button style="margin-top:8px" class="btn full" data-a="myLogout">Salir de Mis citas</button>';
  }
  return h;
}
function myAppointmentsOverlay(){return '<div class="overlay"><section class="bookingPanel">'+bookingHeader("Mis citas")+'<div class="panelBody">'+renderMyAppointments()+'</div></section></div>'}

function render(){
  if(error&&!business){document.body.classList.remove('modalOpen');document.getElementById('app').innerHTML='<div class="loadingPage"><div class="err">'+esc(error)+'</div></div>';return}
  if(!business){document.body.classList.remove('modalOpen');document.getElementById('app').innerHTML='<div class="loadingPage">Cargando negocio…</div>';return}
  let h=landing();
  const modal=view==="my"?myAppointmentsOverlay():(step>0?bookingOverlay():"");
  if(modal){document.body.classList.add('modalOpen');h+=modal}else document.body.classList.remove('modalOpen');
  document.getElementById('app').innerHTML=h;
}

document.getElementById('app').addEventListener('input',e=>{
  if(step===4&&['name','phone','email','notes'].includes(e.target.id))updateBookingButton();
  if(e.target.id==='myCode'){
    myCode=e.target.value.replace(/[^0-9]/g,'').slice(0,6);e.target.value=myCode;
    const button=document.querySelector('[data-a="verifyMyCode"]');
    if(button)button.disabled=myBusy||!/^[0-9]{6}$/.test(myCode);
  }
});
setInterval(()=>{
  const button=document.querySelector('[data-a="requestMyCode"]');
  if(button&&myStep==='code')button.disabled=myBusy||Date.now()<myResendAt;
},1000);

document.getElementById('app').addEventListener('change',e=>{
  if(step===4&&['phoneCountry','rem'].includes(e.target.id))updateBookingButton();
  if(e.target.id==='date'){
    const selected=e.target.value;
    if(selected&&selected<todayInBusinessTz()){booking.date='';booking.time='';availability=[];error='Selecciona una fecha de hoy en adelante.';render();return}
    booking.date=selected;booking.time='';availability=[];loadAvailability();
  }
});
document.getElementById('app').addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.disabled)return;
  const a=t.dataset.a;error='';
  if(a==='openBooking'){view='home';step=1;menuOpen=false;render()}
  else if(a==='closeBooking'){step=0;view='home';menuOpen=false;render()}
  else if(a==='next'){step++;render()}
  else if(a==='back'){if(step===4)readBookingFields();step=Math.max(1,step-1);render()}
  else if(a==='svc'){
    booking.service=services.find(x=>x.id===t.dataset.id);
    if(booking.professional){
      const ids=Array.isArray(booking.professional.service_ids)?booking.professional.service_ids.map(String):[];
      if(ids.length&&!ids.includes(String(booking.service.id)))booking.professional=null;
    }
    clearAvailabilitySelection();step=booking.professional?3:2;render();
  }
  else if(a==='svcDirect'){booking.service=services.find(x=>x.id===t.dataset.id);booking.professional=null;clearAvailabilitySelection();view='home';step=2;render()}
  else if(a==='proDirect'){booking.professional=professionals.find(x=>x.id===t.dataset.id)||null;booking.service=null;clearAvailabilitySelection();view='home';step=1;render()}
  else if(a==='pro'){booking.professional=professionals.find(x=>x.id===t.dataset.id)||null;clearAvailabilitySelection();step=3;render()}
  else if(a==='time'){booking.time=t.dataset.v;render()}
  else if(a==='book'){booking.name=document.getElementById('name').value;booking.phoneCountry=document.getElementById('phoneCountry').value;booking.phone=document.getElementById('phone').value;booking.email=document.getElementById('email').value;booking.notes=document.getElementById('notes').value;booking.reminder=document.getElementById('rem').checked;book()}
  else if(a==='my'){view='my';step=0;myStep=myToken?'list':myStep;menuOpen=false;message='';if(myToken){myBusy=true;render();loadMyAppointments().catch(e=>error=e.message).finally(()=>{myBusy=false;render()})}else render()}
  else if(a==='home'){view='home';step=0;error='';message='';menuOpen=false;render()}
  else if(a==='identifyMy'){identifyMyAppointments()}
  else if(a==='requestMyCode'){requestMyCode()}
  else if(a==='verifyMyCode'){verifyMyCode()}
  else if(a==='myBack'){clearMyAccess();myResendAt=0;message='';render()}
  else if(a==='myLogout'){clearMyAccess();myPhoneCountry='+57';myPhone='';message='';render()}
  else if(a==='newBooking'){view='home';booking={service:null,professional:null,date:'',time:'',name:'',phoneCountry:'+57',phone:'',email:'',notes:'',reminder:true};availability=[];step=1;error='';message='';render()}
  else if(a==='reset'){booking={service:null,professional:null,date:'',time:'',name:'',phoneCountry:'+57',phone:'',email:'',notes:'',reminder:true};availability=[];view='home';step=1;message='';render()}
  else if(a==='menu'){menuOpen=!menuOpen;render()}
  else if(a==='menuClose'){menuOpen=false;render()}
});

loadBase();
</script>
</body>
</html>
