<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CitaGo · Cliente</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#fbf5f7;--sf:#fff;--ink:#251c2c;--mut:#746a7a;--line:#eadfe5;
  --acc:#6d5bd0;--side:#251d45;--ok:#16794c;--warn:#9a6200;--bad:#b3372a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:20px 12px}
.side h2{font:700 1.25rem Georgia,serif;margin:0 8px 18px}
.side button{display:block;width:100%;border:0;background:none;color:#fff;opacity:.78;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}
.side button.on{background:rgba(255,255,255,.14);opacity:1;font-weight:800}
.main{padding:24px;min-width:0}
.wrap{max-width:1000px;margin:auto}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.kpi b{display:block;font-size:1.8rem}.kpi span{color:var(--mut);font-size:.82rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:8px 12px;font-weight:700}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{border-color:#efb2aa;color:var(--bad)}
.item{border:1px solid var(--line);background:var(--sf);border-radius:14px;padding:12px;margin:8px 0}
.item small{display:block;color:var(--mut)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:.75rem;font-weight:800;background:#e4f4eb;color:var(--ok)}
.tag.w{background:#fff0d6;color:var(--warn)}.tag.x{background:#fbe0dd;color:var(--bad)}
.muted{color:var(--mut)}
.err{background:#fbe0dd;color:var(--bad);padding:10px;border-radius:10px}
.ok{background:#e4f4eb;color:var(--ok);padding:10px;border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem}
.loading{opacity:.7}
.homeActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.apptMeta{display:grid;gap:5px;margin-top:8px}.apptMeta span{color:var(--mut);font-size:.86rem}
@media(max-width:520px){.homeActions{grid-template-columns:1fr}}
.hero{max-width:520px;margin:28px auto;background:var(--sf);border:1px solid var(--line);border-radius:28px;overflow:visible;box-shadow:0 20px 60px -35px #6d5bd0}
.heroHead{text-align:center;padding:30px;background:linear-gradient(180deg,#eee9ff,#fff);border-radius:28px 28px 0 0}
.mark{width:74px;height:74px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;margin:auto;font:700 2rem Georgia,serif;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.heroBody{padding:18px 18px calc(120px + env(safe-area-inset-bottom))}
.choice{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0;background:#fff}
.choice .ico{font-size:1.4rem;width:36px}
.card small{display:block;margin-top:4px;color:var(--mut)}
.mobileActions{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:10px;align-items:center;margin:16px -8px -6px;padding:10px 8px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:14px;box-shadow:0 -8px 24px rgba(37,28,44,.06)}
.mobileActions .btn{flex:1;min-height:48px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.devHint{margin:10px 0 0;padding:9px 10px;border-radius:10px;background:#f6f3ff;color:var(--mut);font-size:.78rem}
@supports (height:100dvh){body{min-height:100dvh}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px}
.slots button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(max-width:760px){body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5;padding:8px;display:flex;overflow:auto}.side h2{display:none}.side button{white-space:nowrap;width:auto}.main{padding:16px}.g2,.g3{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API="https://citago-backend.onrender.com";
const qs=new URLSearchParams(location.search);
const BUSINESS_SLUG=qs.get("biz")||"";
let business=null,services=[],professionals=[],step=0;
let booking={service:null,professional:null,date:"",time:"",name:"",phone:"",email:"",notes:"",reminder:true};
let availability=[],message="",error="",bookingBusy=false;
let view="home",myStep="phone",myPhone="",myToken=sessionStorage.getItem("citago_my_token")||"",myAppointments=[],myBusy=false;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-CO");
function todayInBusinessTz(){
 const tz=(business&&business.timezone)||"America/Bogota";
 const parts=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 const get=t=>parts.find(p=>p.type===t)?.value||"";
 return get("year")+"-"+get("month")+"-"+get("day");
}
function clearAvailabilitySelection({clearDate=true}={}){
 availability=[];
 booking.time="";
 if(clearDate)booking.date="";
}
async function api(path,opts={}){
  const r=await fetch(API+path,opts);
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.detail||("HTTP "+r.status));
  return data;
}
async function loadBase(){
 try{
  if(!BUSINESS_SLUG)throw new Error("Enlace de reserva inválido. Falta identificar el negocio.");
  const catalog=await api("/public/businesses/"+encodeURIComponent(BUSINESS_SLUG)+"/catalog");
  business=catalog.business;
  services=catalog.services||[];
  professionals=catalog.professionals||[];
  document.documentElement.style.setProperty("--acc",business.primary_color||"#6d5bd0");
 }catch(e){error=e.message}
 render();
}
async function loadAvailability(){
 if(!booking.service||!booking.date)return;
 error="";
 try{
  let u="/availability?business_id="+business.id+"&service_id="+booking.service.id+"&date="+booking.date;
  if(booking.professional)u+="&professional_id="+booking.professional.id;
  const x=await api(u);
  availability=x.professionals||[];
 }catch(e){error=e.message;availability=[]}
 render();
}
function eligiblePros(){
 if(!booking.service)return [];
 const sid=booking.service.id;
 return professionals.filter(p=>Array.isArray(p.service_ids)?p.service_ids.includes(sid):true);
}
async function book(){
 if(bookingBusy)return;
 if(!booking.name.trim()||!booking.phone.trim()){error="Escribe tu nombre y WhatsApp.";render();return}
 let professionalId=booking.professional?.id||null;
 if(!professionalId){
  const available=availability.find(x=>(x.slots||[]).includes(booking.time));
  professionalId=available?.professional_id||available?.id||null;
 }
 if(!booking.time||!professionalId){error="Selecciona un horario disponible.";render();return}

 bookingBusy=true;
 error="";
 render();

 try{
  const x=await api("/appointments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   business_id:business.id,service_id:booking.service.id,professional_id:professionalId,
   client_name:booking.name.trim(),client_phone:booking.phone.trim(),client_email:booking.email||null,
   date:booking.date,start_time:booking.time,notes:booking.notes||null,reminder_opt_in:booking.reminder
  })});
  message="Cita creada correctamente. Estado: "+x.appointment.status;
  step=5;
 }catch(e){
  error=e.message;
 }finally{
  bookingBusy=false;
  render();
 }
}
function fmtAppointmentDate(iso){
 const d=new Date(iso);
 const tz=(business&&business.timezone)||"America/Bogota";
 return new Intl.DateTimeFormat("es-CO",{timeZone:tz,weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true}).format(d);
}
function statusLabel(s){return ({CONFIRMED:"Confirmada",PENDING:"Pendiente",COMPLETED:"Completada",NO_SHOW:"No asistió",CANCELLED:"Cancelada",REJECTED:"Rechazada"})[s]||s;}
function statusClass(s){return s==="CONFIRMED"||s==="COMPLETED"?"tag":s==="PENDING"?"tag w":"tag x";}
async function devAccessMyAppointments(){
 const el=document.getElementById("myPhone");
 myPhone=(el?el.value:myPhone).trim();
 const digits=myPhone.replace(/\D/g,"");
 if(digits.length<7){error="Escribe un número de WhatsApp válido.";render();return}
 if(myBusy)return;

 myBusy=true;
 error="";
 message="";
 render();

 try{
  const x=await api("/public/appointments/dev-access",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({business_id:business.id,phone:myPhone})
  });
  myToken=x.access_token;
  sessionStorage.setItem("citago_my_token",myToken);
  await loadMyAppointments();
  myStep="list";
 }catch(e){
  error=e.message;
 }finally{
  myBusy=false;
  render();
 }
}
async function loadMyAppointments(){
 if(!myToken)return;
 try{const x=await api("/public/appointments/my",{headers:{Authorization:"Bearer "+myToken}});myAppointments=x.appointments||[]}
 catch(e){myToken="";sessionStorage.removeItem("citago_my_token");myStep="phone";throw e}
}
function renderMyAppointments(){
 let h='<div class="row" style="justify-content:space-between"><h2 style="margin:0">Mis citas</h2><button class="btn" data-a="home">← Inicio</button></div>';
 if(myStep==="phone"){
  h+='<p class="muted">Ingresa el WhatsApp que usaste al reservar.</p>'+
     '<label>WhatsApp</label>'+
     '<input id="myPhone" inputmode="tel" autocomplete="tel" value="'+esc(myPhone)+'" placeholder="Ej. 3001234567">'+
     '<button style="margin-top:12px;width:100%" class="btn p" data-a="devAccess" '+(myBusy?'disabled':'')+'>'+
     (myBusy?'Consultando…':'Ver mis citas')+'</button>'+
     '<div class="devHint">Acceso temporal de pruebas. La verificación por código de WhatsApp se activará más adelante.</div>';
 }else{
  if(!myAppointments.length){
   h+='<div class="card" style="margin-top:14px"><b>No tienes citas registradas.</b><p class="muted">Cuando reserves una cita aparecerá aquí.</p></div>';
  }
  myAppointments.forEach(a=>h+='<div class="item"><div class="row" style="justify-content:space-between"><b>'+esc(a.service)+'</b><span class="'+statusClass(a.status)+'">'+esc(statusLabel(a.status))+'</span></div><div class="apptMeta"><span>👤 '+esc(a.professional||"Profesional")+'</span><span>📅 '+esc(fmtAppointmentDate(a.start_at))+'</span><span>⏱️ '+esc(a.duration_minutes)+' min</span><span>💰 '+money(a.price)+'</span></div></div>');
  h+='<button class="btn p" data-a="newBooking">Reservar otra cita</button> <button class="btn" data-a="myLogout">Salir de Mis citas</button>';
 }
 return h;
}

function header(){
 if(!business)return "";
 const logo=business.logo_url?'<img src="'+esc(business.logo_url)+'">':esc((business.name||"C")[0]);
 return '<div class="heroHead"><div class="mark">'+logo+'</div><h1>'+esc(business.name)+'</h1><p class="muted">'+esc(business.tagline||"Reserva tu cita")+'</p></div>';
}
function render(){
 let h='<div class="hero">';
 if(error&&!business){document.getElementById("app").innerHTML='<div class="card err">'+esc(error)+'</div>';return}
 if(!business){document.getElementById("app").innerHTML='<div class="card">Cargando negocio...</div>';return}
 h+=header()+'<div class="heroBody">';
 if(error)h+='<div class="err">'+esc(error)+'</div>';
 if(view==="my"){
  h+=renderMyAppointments();
 }else if(step===0){
  h+='<h2>¿Qué deseas hacer?</h2><p class="muted">Reserva una nueva cita o consulta las que ya tienes.</p><div class="homeActions"><button class="btn p" data-a="next">📅 Reservar cita</button><button class="btn" data-a="my">🗓️ Mis citas</button></div>';
 }else if(step===1){
  h+='<h2>Selecciona un servicio</h2>';
  services.filter(s=>s.is_active!==false).forEach(s=>h+='<button class="choice" data-a="svc" data-id="'+s.id+'"><span class="ico">'+esc(s.icon||"✨")+'</span><span><b>'+esc(s.name)+'</b><small>'+s.duration_minutes+' min · '+money(s.price)+'</small></span></button>');
  h+='<div class="mobileActions"><button class="btn" data-a="back">← Volver</button></div>';
 }else if(step===2){
  h+='<h2>¿Con quién?</h2><button class="choice" data-a="pro" data-id=""><span class="ico">👥</span><span><b>Cualquier profesional</b><small>Te asignamos una opción disponible</small></span></button>';
  eligiblePros().forEach(p=>h+='<button class="choice" data-a="pro" data-id="'+p.id+'"><span class="ico">👤</span><span><b>'+esc(p.name)+'</b><small>'+esc(p.specialty||"Profesional")+'</small></span></button>');
  h+='<div class="mobileActions"><button class="btn" data-a="back">← Volver</button></div>';
 }else if(step===3){
  h+='<h2>Fecha y hora</h2><label>Fecha</label><input type="date" id="date" min="'+todayInBusinessTz()+'" value="'+esc(booking.date)+'">';
  if(booking.date){
   const slots=[...new Set(availability.flatMap(x=>x.slots||[]))];
   h+='<label>Horarios disponibles</label><div class="slots">';
   if(!slots.length)h+='<p class="muted">No hay horarios disponibles.</p>';
   slots.forEach(t=>h+='<button data-a="time" data-v="'+t+'" class="'+(booking.time===t?"on":"")+'">'+t+'</button>');
   h+='</div>';
  }
  h+='<div class="mobileActions"><button class="btn" data-a="back">← Volver</button><button class="btn p" data-a="next" '+(!booking.time?"disabled":"")+'>Continuar</button></div>';
 }else if(step===4){
  h+='<h2>Tus datos</h2><div class="card"><b>'+esc(booking.service.name)+'</b><small>'+esc(booking.date)+' · '+esc(booking.time)+'</small></div>';
  h+='<label>Nombre completo</label><input id="name" autocomplete="name" value="'+esc(booking.name)+'"><label>WhatsApp</label><input id="phone" inputmode="tel" autocomplete="tel" value="'+esc(booking.phone)+'"><label>Email (opcional)</label><input id="email" type="email" autocomplete="email" value="'+esc(booking.email)+'"><label>Notas</label><textarea id="notes" rows="3">'+esc(booking.notes)+'</textarea><label><input style="width:auto" type="checkbox" id="rem" '+(booking.reminder?"checked":"")+'> Quiero recordatorios</label><div class="mobileActions"><button class="btn" data-a="back" '+(bookingBusy?"disabled":"")+'>← Volver</button><button class="btn p" data-a="book" '+(bookingBusy?"disabled":"")+'>'+(bookingBusy?"Guardando…":"Confirmar cita")+'</button></div>';
 }else{
  h+='<div class="ok">'+esc(message||"Cita creada correctamente.")+'</div><h2>¡Listo! 🎉</h2><p class="muted">El negocio podrá gestionar el estado desde su panel.</p><button class="btn p" data-a="reset">Reservar otra cita</button>';
 }
 h+='</div></div>';
 document.getElementById("app").innerHTML=h;
}
document.getElementById("app").addEventListener("change",e=>{
 if(e.target.id==="date"){
  const selected=e.target.value;
  if(selected&&selected<todayInBusinessTz()){
   booking.date="";
   booking.time="";
   availability=[];
   error="Selecciona una fecha de hoy en adelante.";
   render();
   return;
  }
  booking.date=selected;
  booking.time="";
  availability=[];
  loadAvailability();
 }
});
document.getElementById("app").addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");if(!t)return;
 const a=t.dataset.a;
 error="";
 if(a==="next"){step++;render()}
 else if(a==="back"){step=Math.max(0,step-1);render()}
 else if(a==="svc"){booking.service=services.find(x=>x.id===t.dataset.id);booking.professional=null;clearAvailabilitySelection();step=2;render()}
 else if(a==="pro"){booking.professional=professionals.find(x=>x.id===t.dataset.id)||null;clearAvailabilitySelection();step=3;render()}
 else if(a==="time"){booking.time=t.dataset.v;render()}
 else if(a==="book"){booking.name=document.getElementById("name").value;booking.phone=document.getElementById("phone").value;booking.email=document.getElementById("email").value;booking.notes=document.getElementById("notes").value;booking.reminder=document.getElementById("rem").checked;book()}
 else if(a==="my"){view="my";myStep=myToken?"list":"phone";if(myToken){myBusy=true;loadMyAppointments().then(()=>{myStep="list"}).catch(e=>error=e.message).finally(()=>{myBusy=false;render()})}else render()}
 else if(a==="home"){view="home";error="";message="";render()}
 else if(a==="devAccess"){devAccessMyAppointments()}
 else if(a==="myLogout"){myToken="";myAppointments=[];myStep="phone";sessionStorage.removeItem("citago_my_token");render()}
 else if(a==="newBooking"){view="home";booking={service:null,professional:null,date:"",time:"",name:"",phone:"",email:"",notes:"",reminder:true};availability=[];step=1;error="";message="";render()}
 else if(a==="reset"){booking={service:null,professional:null,date:"",time:"",name:"",phone:"",email:"",notes:"",reminder:true};availability=[];step=0;message="";render()}
});
loadBase();
</script></body></html>
