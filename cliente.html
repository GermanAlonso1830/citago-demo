<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservas · Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f7;--sf:#fff;--ink:#2f2b2a;--mut:#77706d;--line:#ece4e1;
  --acc:#b98888;--acc-soft:#f5eaea;--ok:#19764d;--warn:#9a6200;--bad:#b3372a;
  --shadow:0 18px 45px rgba(55,38,36,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
body.modalOpen{overflow:hidden}

.siteHeader{position:sticky;top:0;z-index:40;background:rgba(255,250,248,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(236,228,225,.9)}
.headerInner{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brandMark{width:46px;height:46px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:0 0 auto;box-shadow:0 8px 18px rgba(70,40,40,.10)}
.brandMark img{width:100%;height:100%;object-fit:cover}
.brandName{font-weight:800;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headerSpacer{flex:1}
.navLinks{display:flex;gap:24px;align-items:center;color:#4e4947;font-size:.95rem}
.navLinks a:hover{color:var(--acc)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;transition:.2s ease}
.btn:hover{transform:translateY(-1px)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.btn.full{width:100%}
.menuBtn{display:none;border:0;background:transparent;font-size:1.7rem;padding:6px}

.hero{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.05fr .95fr;min-height:640px;align-items:stretch}
.heroCopy{padding:80px 42px 70px 24px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-self:flex-start;padding:9px 14px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.hero h1{font:600 clamp(3rem,6vw,5.8rem)/.98 "Playfair Display",serif;margin:28px 0 24px;letter-spacing:-.03em}
.hero h1 em{color:var(--acc);font-weight:600}
.hero p{font-size:1.12rem;line-height:1.8;color:var(--mut);max-width:610px;margin:0 0 30px}
.heroActions{display:flex;gap:12px;flex-wrap:wrap}
.heroActions .btn{padding:14px 22px;border-radius:999px}
.heroImage{min-height:640px;background:linear-gradient(145deg,var(--acc-soft),#efe5e0);position:relative;overflow:hidden}
.heroImage.hasImage{background-size:cover;background-position:center}
.heroImage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,10,.02),rgba(20,10,10,.18))}
.heroImageBadge{position:absolute;right:24px;bottom:24px;z-index:1;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;font-size:1.55rem;box-shadow:var(--shadow)}

.section{max-width:1180px;margin:auto;padding:84px 24px}
.sectionHead{text-align:center;max-width:700px;margin:0 auto 38px}
.sectionHead .eyebrow{align-self:auto}
.sectionHead h2{font:600 clamp(2.2rem,4vw,3.6rem)/1.08 "Playfair Display",serif;margin:18px 0 12px}
.sectionHead p{color:var(--mut);margin:0;font-size:1.04rem}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:-34px;position:relative;z-index:2}
.feature{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 14px 34px rgba(50,35,33,.05)}
.featureIcon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-size:1.15rem;margin-bottom:12px}
.feature b{display:block;margin-bottom:4px}.feature span{color:var(--mut);font-size:.93rem}

.serviceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.serviceCard{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(50,35,33,.04)}
.serviceVisual{height:190px;background:linear-gradient(145deg,var(--acc-soft),#f0ebe9);display:grid;place-items:center;font-size:3rem;overflow:hidden}
.serviceVisual img{width:100%;height:100%;object-fit:cover}
.serviceBody{padding:18px}
.serviceBody h3{margin:0 0 6px;font-size:1.05rem}
.serviceMeta{color:var(--mut);font-size:.91rem;margin-bottom:16px}
.serviceFoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:800;color:var(--acc)}
.teamGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.person{background:#fff;border-radius:22px;border:1px solid var(--line);overflow:hidden}
.personPhoto{aspect-ratio:4/4.6;background:linear-gradient(145deg,#f3ece9,var(--acc-soft));display:grid;place-items:center;font-size:3rem;overflow:hidden}
.personPhoto img{width:100%;height:100%;object-fit:cover}
.personBody{padding:18px}.personBody h3{margin:0 0 4px}.personBody p{margin:0;color:var(--mut);font-size:.92rem}
.contactCard{display:grid;grid-template-columns:1.15fr .85fr;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.contactCopy{padding:38px}.contactCopy h2{font:600 2.5rem/1.1 "Playfair Display",serif;margin:0 0 14px}.contactCopy p{color:var(--mut)}
.contactAside{background:var(--acc-soft);padding:38px;display:grid;align-content:center;gap:12px}
.contactLine{display:flex;gap:12px;align-items:flex-start}.contactLine b{display:block}.contactLine span{color:var(--mut);font-size:.92rem}
.footer{padding:28px 24px;text-align:center;color:var(--mut);font-size:.86rem}

.overlay{position:fixed;inset:0;z-index:80;background:rgba(35,28,26,.45);display:flex;justify-content:flex-end;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.bookingPanel{width:min(520px,100%);height:100%;background:#fff;box-shadow:-18px 0 50px rgba(20,10,10,.15);display:flex;flex-direction:column;animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(18px);opacity:.6}to{transform:none;opacity:1}}
.panelHead{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
.panelHead h2{margin:0;font-size:1.25rem}.closeBtn{border:0;background:none;font-size:1.6rem;color:var(--mut);padding:4px}
.panelBody{padding:22px;overflow:auto;flex:1}
.panelFoot{padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:#fff}
.panelFoot .btn{flex:1;min-height:48px}
.choice{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;background:#fff;width:100%;text-align:left}
.choice:hover{border-color:color-mix(in srgb,var(--acc) 55%, var(--line));background:#fffdfc}
.choice .thumb{width:62px;height:62px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;font-size:1.5rem;overflow:hidden;flex:0 0 auto}
.choice .thumb img{width:100%;height:100%;object-fit:cover}.choice b{display:block}.choice small{display:block;color:var(--mut);margin-top:3px}
.stepTitle{font:600 1.8rem/1.15 "Playfair Display",serif;margin:0 0 8px}.stepSub{color:var(--mut);margin:0 0 20px}
label{display:block;font-size:.83rem;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.slots button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px}
.slots button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.summary{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fffdfc;margin-bottom:16px}
.summaryRow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}.summaryRow:last-child{border-bottom:0}.summaryRow span{color:var(--mut)}
.err{background:#fbe0dd;color:var(--bad);padding:11px 12px;border-radius:12px;margin-bottom:14px}.ok{background:#e4f4eb;color:var(--ok);padding:11px 12px;border-radius:12px;margin-bottom:14px}
.tag{display:inline-block;border-radius:999px;padding:4px 9px;font-size:.75rem;font-weight:800;background:#e4f4eb;color:var(--ok)}
.tag.w{background:#fff0d6;color:var(--warn)}.tag.x{background:#fbe0dd;color:var(--bad)}
.item{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;margin:10px 0}.apptMeta{display:grid;gap:5px;margin-top:8px}.apptMeta span{color:var(--mut);font-size:.9rem}
.muted{color:var(--mut)}.devHint{margin:10px 0 0;padding:9px 10px;border-radius:10px;background:#faf7ff;color:var(--mut);font-size:.78rem}
.loadingPage{min-height:100vh;display:grid;place-items:center;color:var(--mut)}
.empty{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--mut)}

.mobileMenu{display:none}
@media(max-width:900px){
  .navLinks{display:none}.menuBtn{display:block}.hero{grid-template-columns:1fr}.heroCopy{padding:58px 24px 44px}.heroImage{min-height:420px}.features{grid-template-columns:1fr;margin-top:20px}.serviceGrid,.teamGrid{grid-template-columns:repeat(2,1fr)}.contactCard{grid-template-columns:1fr}.mobileMenu.open{display:block;position:absolute;top:74px;left:14px;right:14px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px}.mobileMenu a,.mobileMenu button{display:block;width:100%;padding:12px;border:0;background:none;text-align:left;font-weight:600}
}
@media(max-width:640px){
  .headerInner{padding:11px 14px}.brandMark{width:42px;height:42px}.headerReserve{padding:9px 11px}.heroCopy{padding:48px 20px 38px}.hero h1{font-size:3.25rem}.heroImage{min-height:320px}.section{padding:62px 18px}.serviceGrid,.teamGrid{grid-template-columns:1fr}.sectionHead{text-align:left}.sectionHead .eyebrow{align-self:flex-start}.contactCopy,.contactAside{padding:26px}.slots{grid-template-columns:repeat(2,1fr)}.bookingPanel{width:100%}.panelHead{padding:17px 18px}.panelBody{padding:18px}.panelFoot{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API="https://citago-backend.onrender.com";
const qs=new URLSearchParams(location.search);
const BUSINESS_SLUG=qs.get("biz")||"";
let business=null,services=[],professionals=[],step=0;
let booking={service:null,professional:null,date:"",time:"",name:"",phone:"",email:"",notes:"",reminder:true};
let availability=[],message="",error="",bookingBusy=false;
let view="home",myStep="phone",myPhone="",myToken=sessionStorage.getItem("booking_my_token")||sessionStorage.getItem("citago_my_token")||"",myAppointments=[],myBusy=false;
let menuOpen=false;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-CO");
const imgOf=obj=>obj?.image_url||obj?.photo_url||obj?.avatar_url||obj?.cover_url||"";

function todayInBusinessTz(){
  const tz=(business&&business.timezone)||"America/Bogota";
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value||"";
  return get("year")+"-"+get("month")+"-"+get("day");
}
function clearAvailabilitySelection({clearDate=true}={}){availability=[];booking.time="";if(clearDate)booking.date=""}
async function api(path,opts={}){
  const r=await fetch(API+path,opts);
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.detail||("HTTP "+r.status));
  return data;
}
async function loadBase(){
  try{
    if(!BUSINESS_SLUG)throw new Error("Enlace de reserva inválido. Falta identificar el negocio.");
    const catalog=await api("/public/businesses/"+encodeURIComponent(BUSINESS_SLUG)+"/catalog");
    business=catalog.business;
    services=catalog.services||[];
    professionals=catalog.professionals||[];
    document.documentElement.style.setProperty("--acc",business.primary_color||"#b98888");
    if(business.secondary_color)document.documentElement.style.setProperty("--acc-soft",business.secondary_color);
    document.title=(business.name||"Reservas")+" · Reservas";
  }catch(e){error=e.message}
  render();
}
async function loadAvailability(){
  if(!booking.service||!booking.date)return;
  error="";
  try{
    let u="/availability?business_id="+business.id+"&service_id="+booking.service.id+"&date="+booking.date;
    if(booking.professional)u+="&professional_id="+booking.professional.id;
    const x=await api(u);
    availability=x.professionals||[];
  }catch(e){error=e.message;availability=[]}
  render();
}
function eligiblePros(){
  if(!booking.service)return [];
  const sid=booking.service.id;
  return professionals.filter(p=>Array.isArray(p.service_ids)?p.service_ids.includes(sid):true);
}
function currentProfessionalName(){return booking.professional?.name||"Cualquier profesional disponible"}
function fmtShortDate(date){
  if(!date)return "";
  const d=new Date(date+"T12:00:00");
  return new Intl.DateTimeFormat("es-CO",{weekday:"long",day:"numeric",month:"long"}).format(d);
}
async function book(){
  if(bookingBusy)return;
  if(!booking.name.trim()||!booking.phone.trim()){error="Escribe tu nombre y WhatsApp.";render();return}
  let professionalId=booking.professional?.id||null;
  if(!professionalId){
    const available=availability.find(x=>(x.slots||[]).includes(booking.time));
    professionalId=available?.professional_id||available?.id||null;
  }
  if(!booking.time||!professionalId){error="Selecciona un horario disponible.";render();return}
  bookingBusy=true;error="";render();
  try{
    const x=await api("/appointments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      business_id:business.id,service_id:booking.service.id,professional_id:professionalId,
      client_name:booking.name.trim(),client_phone:booking.phone.trim(),client_email:booking.email||null,
      date:booking.date,start_time:booking.time,notes:booking.notes||null,reminder_opt_in:booking.reminder
    })});
    message="Tu cita quedó registrada correctamente. Estado: "+statusLabel(x.appointment.status)+".";
    step=5;
  }catch(e){error=e.message}
  finally{bookingBusy=false;render()}
}
function fmtAppointmentDate(iso){
  const d=new Date(iso);const tz=(business&&business.timezone)||"America/Bogota";
  return new Intl.DateTimeFormat("es-CO",{timeZone:tz,weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true}).format(d);
}
function statusLabel(s){return ({CONFIRMED:"Confirmada",PENDING:"Pendiente",COMPLETED:"Completada",NO_SHOW:"No asistió",CANCELLED:"Cancelada",REJECTED:"Rechazada"})[s]||s}
function statusClass(s){return s==="CONFIRMED"||s==="COMPLETED"?"tag":s==="PENDING"?"tag w":"tag x"}
async function devAccessMyAppointments(){
  const el=document.getElementById("myPhone");myPhone=(el?el.value:myPhone).trim();
  const digits=myPhone.replace(/\D/g,"");
  if(digits.length<7){error="Escribe un número de WhatsApp válido.";render();return}
  if(myBusy)return;
  myBusy=true;error="";message="";render();
  try{
    const x=await api("/public/appointments/dev-access",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({business_id:business.id,phone:myPhone})});
    myToken=x.access_token;sessionStorage.setItem("booking_my_token",myToken);await loadMyAppointments();myStep="list";
  }catch(e){error=e.message}
  finally{myBusy=false;render()}
}
async function loadMyAppointments(){
  if(!myToken)return;
  try{const x=await api("/public/appointments/my",{headers:{Authorization:"Bearer "+myToken}});myAppointments=x.appointments||[]}
  catch(e){myToken="";sessionStorage.removeItem("booking_my_token");sessionStorage.removeItem("citago_my_token");myStep="phone";throw e}
}

function brandLogo(){
  const logo=business?.logo_url;
  return logo?'<img src="'+esc(logo)+'" alt="">':esc((business?.name||"R")[0]);
}
function publicHeader(){
  return '<header class="siteHeader"><div class="headerInner">'+
    '<a class="brand" href="#inicio" data-a="home"><div class="brandMark">'+brandLogo()+'</div><div class="brandName">'+esc(business.name)+'</div></a>'+
    '<div class="headerSpacer"></div><nav class="navLinks"><a href="#inicio">Inicio</a><a href="#servicios">Servicios</a><a href="#equipo">Equipo</a><a href="#contacto">Contacto</a></nav>'+
    '<button class="btn p headerReserve" data-a="openBooking">📅 Reservar</button><button class="menuBtn" data-a="menu">☰</button>'+
    '<div class="mobileMenu '+(menuOpen?'open':'')+'"><a href="#inicio" data-a="menuClose">Inicio</a><a href="#servicios" data-a="menuClose">Servicios</a><a href="#equipo" data-a="menuClose">Equipo</a><a href="#contacto" data-a="menuClose">Contacto</a><button data-a="my">Mis citas</button></div>'+
  '</div></header>';
}
function heroSection(){
  const title=business.hero_title||business.tagline||"Tu momento empieza aquí";
  const desc=business.description||"Reserva fácil, elige el servicio que quieres y encuentra el horario que mejor se adapte a ti.";
  const cover=business.cover_url||business.banner_url||business.hero_image_url||"";
  const heroStyle=cover?' style="background-image:url(\''+esc(cover)+'\')"':'';
  return '<main id="inicio"><section class="hero"><div class="heroCopy">'+
    '<span class="eyebrow">Bienestar · Servicios · Reservas</span><h1>'+esc(title).replace(/\b(bienestar|belleza|experiencia|momento)\b/i,'<em>$1</em>')+'</h1><p>'+esc(desc)+'</p>'+
    '<div class="heroActions"><button class="btn p" data-a="openBooking">Reservar cita</button><button class="btn ghost" data-a="my">Ver mis citas</button></div></div>'+
    '<div class="heroImage '+(cover?'hasImage':'')+'"'+heroStyle+'><div class="heroImageBadge">📅</div></div></section></main>';
}
function featureStrip(){
  return '<section class="section" style="padding-top:0"><div class="features">'+
    '<div class="feature"><div class="featureIcon">✓</div><b>Reserva sencilla</b><span>Elige servicio, profesional, fecha y hora en pocos pasos.</span></div>'+
    '<div class="feature"><div class="featureIcon">⏱</div><b>Horarios en tiempo real</b><span>Solo ves opciones disponibles para evitar confusiones.</span></div>'+
    '<div class="feature"><div class="featureIcon">💬</div><b>Confirmación clara</b><span>Consulta tus citas y mantén tus datos de reserva a mano.</span></div>'+
  '</div></section>';
}
function serviceCard(s){
  const image=imgOf(s);
  return '<article class="serviceCard"><div class="serviceVisual">'+(image?'<img src="'+esc(image)+'" alt="">':esc(s.icon||"✨"))+'</div><div class="serviceBody"><h3>'+esc(s.name)+'</h3><div class="serviceMeta">'+esc(s.duration_minutes)+' min</div><div class="serviceFoot"><span class="price">'+money(s.price)+'</span><button class="btn" data-a="svcDirect" data-id="'+esc(s.id)+'">Reservar</button></div></div></article>';
}
function servicesSection(){
  const active=services.filter(s=>s.is_active!==false);
  return '<section class="section" id="servicios"><div class="sectionHead"><span class="eyebrow">Nuestros servicios</span><h2>Encuentra lo que necesitas</h2><p>Explora los servicios disponibles y reserva directamente el que prefieras.</p></div>'+
    (active.length?'<div class="serviceGrid">'+active.slice(0,9).map(serviceCard).join('')+'</div>':'<div class="empty">Este negocio todavía no ha publicado servicios.</div>')+'</section>';
}
function teamSection(){
  if(!professionals.length)return '';
  return '<section class="section" id="equipo"><div class="sectionHead"><span class="eyebrow">Nuestro equipo</span><h2>Profesionales para atenderte</h2><p>Conoce a las personas disponibles para tus servicios.</p></div><div class="teamGrid">'+professionals.slice(0,9).map(p=>{
    const image=imgOf(p);
    return '<article class="person"><div class="personPhoto">'+(image?'<img src="'+esc(image)+'" alt="">':'👤')+'</div><div class="personBody"><h3>'+esc(p.name)+'</h3><p>'+esc(p.specialty||"Profesional")+'</p></div></article>';
  }).join('')+'</div></section>';
}
function contactSection(){
  const address=business.address||business.location||"Consulta la ubicación directamente con el negocio.";
  const phone=business.phone||business.whatsapp||business.contact_phone||"Disponible al confirmar tu reserva";
  const hours=business.hours_text||"Consulta la disponibilidad al reservar";
  return '<section class="section" id="contacto"><div class="contactCard"><div class="contactCopy"><span class="eyebrow">Contacto</span><h2>¿Listo para reservar?</h2><p>Agenda desde aquí y consulta la disponibilidad actual del negocio.</p><button class="btn p" data-a="openBooking">Reservar ahora</button></div><div class="contactAside">'+
    '<div class="contactLine"><div>📍</div><div><b>Ubicación</b><span>'+esc(address)+'</span></div></div>'+
    '<div class="contactLine"><div>💬</div><div><b>Contacto</b><span>'+esc(phone)+'</span></div></div>'+
    '<div class="contactLine"><div>🕐</div><div><b>Horarios</b><span>'+esc(hours)+'</span></div></div>'+
  '</div></div></section>';
}
function landing(){return publicHeader()+heroSection()+featureStrip()+servicesSection()+teamSection()+contactSection()+'<footer class="footer">Reservas digitales para '+esc(business.name)+'</footer>'}

function bookingHeader(title="Reservar cita"){
  return '<div class="panelHead"><h2>'+esc(title)+'</h2><button class="closeBtn" data-a="closeBooking" aria-label="Cerrar">×</button></div>';
}
function bookingStepContent(){
  let h='';
  if(error)h+='<div class="err">'+esc(error)+'</div>';
  if(step===1){
    h+='<h3 class="stepTitle">Selecciona un servicio</h3><p class="stepSub">Elige el servicio que quieres reservar.</p>';
    const active=services.filter(s=>s.is_active!==false);
    h+=active.length?active.map(s=>'<button class="choice" data-a="svc" data-id="'+esc(s.id)+'"><span class="thumb">'+(imgOf(s)?'<img src="'+esc(imgOf(s))+'" alt="">':esc(s.icon||"✨"))+'</span><span><b>'+esc(s.name)+'</b><small>'+esc(s.duration_minutes)+' min · '+money(s.price)+'</small></span></button>').join(''):'<div class="empty">No hay servicios disponibles.</div>';
  }else if(step===2){
    h+='<h3 class="stepTitle">¿Con quién?</h3><p class="stepSub">Puedes elegir a alguien o dejar que asignemos una opción disponible.</p>';
    h+='<button class="choice" data-a="pro" data-id=""><span class="thumb">👥</span><span><b>Cualquier profesional</b><small>Te asignamos una opción disponible</small></span></button>';
    h+=eligiblePros().map(p=>'<button class="choice" data-a="pro" data-id="'+esc(p.id)+'"><span class="thumb">'+(imgOf(p)?'<img src="'+esc(imgOf(p))+'" alt="">':'👤')+'</span><span><b>'+esc(p.name)+'</b><small>'+esc(p.specialty||"Profesional")+'</small></span></button>').join('');
  }else if(step===3){
    h+='<h3 class="stepTitle">Fecha y hora</h3><p class="stepSub">Selecciona el momento que mejor te funcione.</p><label>Fecha</label><input type="date" id="date" min="'+todayInBusinessTz()+'" value="'+esc(booking.date)+'">';
    if(booking.date){
      const slots=[...new Set(availability.flatMap(x=>x.slots||[]))];
      h+='<label>Horarios disponibles</label><div class="slots">';
      if(!slots.length)h+='<div class="empty" style="grid-column:1/-1">No hay horarios disponibles para esta fecha.</div>';
      slots.forEach(t=>h+='<button data-a="time" data-v="'+esc(t)+'" class="'+(booking.time===t?'on':'')+'">'+esc(t)+'</button>');
      h+='</div>';
    }
  }else if(step===4){
    h+='<h3 class="stepTitle">Tus datos</h3><p class="stepSub">Revisa la reserva y completa tus datos de contacto.</p>';
    h+='<div class="summary"><div class="summaryRow"><span>Servicio</span><b>'+esc(booking.service?.name||'')+'</b></div><div class="summaryRow"><span>Profesional</span><b>'+esc(currentProfessionalName())+'</b></div><div class="summaryRow"><span>Fecha</span><b>'+esc(fmtShortDate(booking.date))+'</b></div><div class="summaryRow"><span>Hora</span><b>'+esc(booking.time)+'</b></div><div class="summaryRow"><span>Total</span><b>'+money(booking.service?.price)+'</b></div></div>';
    h+='<label>Nombre completo</label><input id="name" autocomplete="name" value="'+esc(booking.name)+'"><label>WhatsApp</label><input id="phone" inputmode="tel" autocomplete="tel" value="'+esc(booking.phone)+'"><label>Email (opcional)</label><input id="email" type="email" autocomplete="email" value="'+esc(booking.email)+'"><label>Notas (opcional)</label><textarea id="notes" rows="3">'+esc(booking.notes)+'</textarea><label style="display:flex;gap:8px;align-items:center"><input style="width:auto" type="checkbox" id="rem" '+(booking.reminder?'checked':'')+'> Quiero recordatorios</label>';
  }else if(step===5){
    h+='<div class="ok">'+esc(message||"Cita creada correctamente.")+'</div><h3 class="stepTitle">¡Reserva lista! 🎉</h3><p class="stepSub">Tu cita quedó registrada. Puedes consultar tus citas desde este mismo enlace.</p>';
    h+='<div class="summary"><div class="summaryRow"><span>Servicio</span><b>'+esc(booking.service?.name||'')+'</b></div><div class="summaryRow"><span>Fecha</span><b>'+esc(fmtShortDate(booking.date))+'</b></div><div class="summaryRow"><span>Hora</span><b>'+esc(booking.time)+'</b></div></div>';
  }
  return h;
}
function bookingFooter(){
  if(step===1)return '<div class="panelFoot"><button class="btn" data-a="closeBooking">Cerrar</button></div>';
  if(step===2)return '<div class="panelFoot"><button class="btn" data-a="back">← Volver</button></div>';
  if(step===3)return '<div class="panelFoot"><button class="btn" data-a="back">← Volver</button><button class="btn p" data-a="next" '+(!booking.time?'disabled':'')+'>Continuar</button></div>';
  if(step===4)return '<div class="panelFoot"><button class="btn" data-a="back" '+(bookingBusy?'disabled':'')+'>← Volver</button><button class="btn p" data-a="book" '+(bookingBusy?'disabled':'')+'>'+(bookingBusy?'Guardando…':'Confirmar cita')+'</button></div>';
  return '<div class="panelFoot"><button class="btn" data-a="my">Mis citas</button><button class="btn p" data-a="reset">Reservar otra</button></div>';
}
function bookingOverlay(){return '<div class="overlay"><section class="bookingPanel">'+bookingHeader()+ '<div class="panelBody">'+bookingStepContent()+'</div>'+bookingFooter()+'</section></div>'}

function renderMyAppointments(){
  let h='<h3 class="stepTitle">Mis citas</h3>';
  if(error)h+='<div class="err">'+esc(error)+'</div>';
  if(myStep==="phone"){
    h+='<p class="stepSub">Ingresa el WhatsApp que usaste al reservar.</p><label>WhatsApp</label><input id="myPhone" inputmode="tel" autocomplete="tel" value="'+esc(myPhone)+'" placeholder="Ej. 3001234567"><button style="margin-top:12px" class="btn p full" data-a="devAccess" '+(myBusy?'disabled':'')+'>'+(myBusy?'Consultando…':'Ver mis citas')+'</button><div class="devHint">Acceso temporal de pruebas. La verificación por código de WhatsApp se activará más adelante.</div>';
  }else{
    if(!myAppointments.length)h+='<div class="empty">No tienes citas registradas.</div>';
    myAppointments.forEach(a=>h+='<div class="item"><div style="display:flex;justify-content:space-between;gap:10px"><b>'+esc(a.service)+'</b><span class="'+statusClass(a.status)+'">'+esc(statusLabel(a.status))+'</span></div><div class="apptMeta"><span>👤 '+esc(a.professional||"Profesional")+'</span><span>📅 '+esc(fmtAppointmentDate(a.start_at))+'</span><span>⏱️ '+esc(a.duration_minutes)+' min</span><span>💰 '+money(a.price)+'</span></div></div>');
    h+='<button class="btn p full" data-a="newBooking">Reservar otra cita</button><button style="margin-top:8px" class="btn full" data-a="myLogout">Salir de Mis citas</button>';
  }
  return h;
}
function myAppointmentsOverlay(){return '<div class="overlay"><section class="bookingPanel">'+bookingHeader("Mis citas")+'<div class="panelBody">'+renderMyAppointments()+'</div></section></div>'}

function render(){
  if(error&&!business){document.body.classList.remove('modalOpen');document.getElementById('app').innerHTML='<div class="loadingPage"><div class="err">'+esc(error)+'</div></div>';return}
  if(!business){document.body.classList.remove('modalOpen');document.getElementById('app').innerHTML='<div class="loadingPage">Cargando negocio…</div>';return}
  let h=landing();
  const modal=view==="my"?myAppointmentsOverlay():(step>0?bookingOverlay():"");
  if(modal){document.body.classList.add('modalOpen');h+=modal}else document.body.classList.remove('modalOpen');
  document.getElementById('app').innerHTML=h;
}

document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='date'){
    const selected=e.target.value;
    if(selected&&selected<todayInBusinessTz()){booking.date='';booking.time='';availability=[];error='Selecciona una fecha de hoy en adelante.';render();return}
    booking.date=selected;booking.time='';availability=[];loadAvailability();
  }
});
document.getElementById('app').addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;error='';
  if(a==='openBooking'){view='home';step=1;menuOpen=false;render()}
  else if(a==='closeBooking'){step=0;view='home';menuOpen=false;render()}
  else if(a==='next'){step++;render()}
  else if(a==='back'){step=Math.max(1,step-1);render()}
  else if(a==='svc'){booking.service=services.find(x=>x.id===t.dataset.id);booking.professional=null;clearAvailabilitySelection();step=2;render()}
  else if(a==='svcDirect'){booking.service=services.find(x=>x.id===t.dataset.id);booking.professional=null;clearAvailabilitySelection();view='home';step=2;render()}
  else if(a==='pro'){booking.professional=professionals.find(x=>x.id===t.dataset.id)||null;clearAvailabilitySelection();step=3;render()}
  else if(a==='time'){booking.time=t.dataset.v;render()}
  else if(a==='book'){booking.name=document.getElementById('name').value;booking.phone=document.getElementById('phone').value;booking.email=document.getElementById('email').value;booking.notes=document.getElementById('notes').value;booking.reminder=document.getElementById('rem').checked;book()}
  else if(a==='my'){view='my';step=0;myStep=myToken?'list':'phone';menuOpen=false;if(myToken){myBusy=true;loadMyAppointments().then(()=>{myStep='list'}).catch(e=>error=e.message).finally(()=>{myBusy=false;render()})}else render()}
  else if(a==='home'){view='home';step=0;error='';message='';menuOpen=false;render()}
  else if(a==='devAccess'){devAccessMyAppointments()}
  else if(a==='myLogout'){myToken='';myAppointments=[];myStep='phone';sessionStorage.removeItem('booking_my_token');sessionStorage.removeItem('citago_my_token');render()}
  else if(a==='newBooking'){view='home';booking={service:null,professional:null,date:'',time:'',name:'',phone:'',email:'',notes:'',reminder:true};availability=[];step=1;error='';message='';render()}
  else if(a==='reset'){booking={service:null,professional:null,date:'',time:'',name:'',phone:'',email:'',notes:'',reminder:true};availability=[];view='home';step=1;message='';render()}
  else if(a==='menu'){menuOpen=!menuOpen;render()}
  else if(a==='menuClose'){menuOpen=false;render()}
});

loadBase();
</script>
</body>
</html>
