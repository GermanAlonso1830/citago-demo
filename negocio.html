<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CitaLite · Panel Moderna Llamativa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#FBF4F6;--sf:#fff;--ink:#241B2B;--mute:#6F6577;--line:#EADFE5;--acc:#B5547A;--on:#fff;--side:#2A1F45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111A;--sf:#1F1925;--ink:#F3EEF6;--mute:#A99FB2;--line:#332A3B}}
:root[data-theme="dark"]{--bg:#15111A;--sf:#1F1925;--ink:#F3EEF6;--mute:#A99FB2;--line:#332A3B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#14101c;color:#fff;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar small{opacity:.65;width:100%;font-size:.75rem}
.bar button{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.85rem}
.bar button[aria-pressed=true]{background:#fff;color:#14101c}
.bar select{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:999px;padding:5px 10px;font-size:.85rem}.bar select option{color:#14101c}
.lk{background:none;border:0;color:var(--acc);font-weight:700;text-decoration:underline;cursor:pointer;margin-top:10px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mg .btn{text-align:center;text-decoration:none;color:var(--ink)}
.wa{margin-top:12px;background:color-mix(in srgb,#25D366 12%,var(--bg));border-radius:14px;padding:12px}
.bub{background:var(--sf);border-radius:12px 12px 12px 4px;padding:10px 12px;max-width:340px;font-size:.9rem;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bub small{display:block;color:var(--mute);font-size:.72rem;margin-top:4px}
.wb{margin-top:8px;display:grid;gap:2px}.wb button{border:0;border-top:1px solid var(--line);background:none;color:#1A8FBF;font-weight:700;padding:8px;cursor:pointer}
.tg.c{background:#DCE8FF;color:#2551A8}.tg.n{background:#E7E3EA;color:#5B5163}
.soft{background:color-mix(in srgb,var(--acc) 12%,var(--sf))}
.cl{max-width:430px;margin:16px auto;background:var(--sf);min-height:640px;border-radius:28px;border:1px solid var(--line);overflow:hidden;box-shadow:0 20px 50px -25px color-mix(in srgb,var(--acc) 60%,transparent);display:flex;flex-direction:column}
@media(max-width:480px){.cl{margin:0;border-radius:0;border:0;min-height:calc(100vh - 80px)}}
.cp{padding:18px 18px 24px;flex:1}
.top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;padding:14px 12px 0}
.top h2{margin:0;text-align:center;font-size:1.05rem}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:none;font-size:1.2rem;cursor:pointer}
.hero{text-align:center;padding:34px 22px 22px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 22%,var(--sf)),var(--sf))}
.brand{font:700 1.7rem Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
.mark{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 2rem Georgia,serif;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:1.9rem;margin:22px 0 4px;letter-spacing:-.02em}
.feat{display:flex;justify-content:space-around;margin:20px 0;font-size:.78rem;color:var(--mute)}
.feat b{display:block;font-size:1.4rem}
.cta{width:100%;background:var(--acc);color:var(--on);border:0;border-radius:14px;padding:14px;font-weight:700;cursor:pointer;margin-top:14px}
.cta:disabled{opacity:.4;cursor:not-allowed}
.btn{background:var(--sf);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.o{border-color:var(--acc);color:var(--acc)}.btn:disabled{opacity:.4;cursor:not-allowed}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer}
.item[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--sf))}
.item small{display:block;color:var(--mute)}
.av{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;flex:none;background:color-mix(in srgb,var(--acc) 15%,var(--sf))}
.av.r{border-radius:50%;font-weight:800;color:#fff;font-size:1.1rem}
.grow{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal i{font-style:normal;font-size:.75rem;color:var(--mute);padding:6px 0}
.cal button{aspect-ratio:1;border:0;border-radius:50%;background:none;cursor:pointer}
.cal button[aria-pressed=true]{background:var(--acc);color:#fff;font-weight:700}
.cal button:disabled{color:var(--mute);opacity:.35;cursor:default}
.mh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px;text-transform:capitalize}
.sl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sl button{border:1.5px solid var(--line);background:var(--sf);border-radius:10px;padding:10px;cursor:pointer}
.sl button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.sl button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
label{display:block;font-size:.82rem;color:var(--mute);margin:12px 0 4px}
input:not([type=checkbox]),select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--sf)}
input[type=color]{height:44px;padding:3px}
.sum{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:6px}
.ok{text-align:center;font-size:3rem}
.rw{display:flex;gap:10px;align-items:center;padding:6px 0}
.sh{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 80px)}
.side{background:var(--side);color:#fff;padding:18px 12px}
.side h3{margin:0 8px 18px;font:700 1.15rem Georgia,serif;letter-spacing:.06em}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;opacity:.75;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.side button[aria-pressed=true]{background:rgba(255,255,255,.14);opacity:1;font-weight:700}
.sh2{display:flex;align-items:center}.side .hb,.cur{display:none}
@media(max-width:800px){.sh{grid-template-columns:1fr;min-height:0}.side{padding:8px 12px}.sh2{gap:12px}
.side h3{margin:0;font-size:.95rem;opacity:.8;order:3}
.side .hb{display:block;order:0;width:44px;height:44px;padding:0;margin:0;background:rgba(255,255,255,.16);opacity:1;text-align:center;font-size:1.35rem}
.cur{display:block;order:1;flex:1;font-weight:700}
.sl2{display:none;margin-top:8px;padding-bottom:6px}.side.open .sl2{display:block}
.side .sl2 button{padding:13px 14px;font-size:1rem}}
.mn{padding:20px 16px 50px;min-width:0}
.mn h1{margin:0;font-size:1.5rem;letter-spacing:-.02em}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.kc{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px}
.kc b{display:block;font-size:1.6rem;line-height:1.1}.kc span{font-size:.8rem;color:var(--mute)}
.pn{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;overflow-x:auto}
.pn h2{margin:0 0 10px;font-size:1.05rem}
table{border-collapse:collapse;width:100%;min-width:480px}
th{font-size:.78rem;text-align:left;color:var(--mute);padding:6px;font-weight:600}
td{border-top:1px solid var(--line);padding:6px;vertical-align:top;font-size:.85rem}
td.off{background:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--mute) 14%,transparent) 6px 12px)}
td.t{color:var(--mute);font-size:.75rem;width:56px;white-space:nowrap}
.ap{border-radius:8px;padding:5px 8px;font-size:.78rem;font-weight:600;background:color-mix(in srgb,var(--c) 28%,var(--sf));border-left:4px solid var(--c)}
.ap small{display:block;font-weight:500;color:var(--mute)}
.tg{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;background:#DDF3E8;color:#16794C}
.tg.w{background:#FFF0D6;color:#9A6200}.tg.x{background:#FBE0DD;color:#B3372A}
.dn{display:flex;gap:6px;align-items:center;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--sf);border-radius:99px;padding:6px 12px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}


/* Final separated demo: internal prototype switcher is hidden. */
.bar{display:none!important}

/* =========================================================
   CONCEPTO B · MODERNA LLAMATIVA
   Visual-only redesign. Business logic/security unchanged.
   ========================================================= */
:root{
  --bg:#F5F5FF;
  --sf:#FFFFFF;
  --ink:#17152B;
  --mute:#72758A;
  --line:#E8E7F3;
  --acc:#7C4DFF;
  --side:#1E1741;
}
body{
  background:
    radial-gradient(circle at 85% 0%,rgba(34,184,255,.12),transparent 28rem),
    radial-gradient(circle at 15% 8%,rgba(233,43,207,.11),transparent 24rem),
    var(--bg);
}
.sh{
  grid-template-columns:228px minmax(0,1fr);
  min-height:100vh;
}
.side{
  position:sticky;
  top:0;
  height:100vh;
  padding:24px 14px;
  color:#fff;
  background:
    radial-gradient(circle at 20% 0%,rgba(63,179,255,.22),transparent 18rem),
    linear-gradient(160deg,#201845 0%,#2E1A58 55%,#191633 100%);
  box-shadow:18px 0 55px rgba(32,22,66,.08);
}
.side h3{
  margin:0 10px 26px;
  font:800 1rem/1.25 "Plus Jakarta Sans",system-ui,sans-serif;
  letter-spacing:-.025em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.side button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  color:rgba(255,255,255,.72);
  opacity:1;
  padding:11px 12px;
  margin:4px 0;
  border-radius:14px;
  font-size:.88rem;
  font-weight:650;
}
.side .sl2 button::before{
  width:30px;
  height:30px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:rgba(255,255,255,.09);
  color:#fff;
  font-size:1rem;
  font-weight:800;
}
.side .sl2 button[data-i="home"]::before{content:"⌂"}
.side .sl2 button[data-i="cit"]::before{content:"◷"}
.side .sl2 button[data-i="svc"]::before{content:"✦"}
.side .sl2 button[data-i="team"]::before{content:"◎"}
.side .sl2 button[data-i="blk"]::before{content:"⊘"}
.side .sl2 button[data-i="rem"]::before{content:"◌"}
.side .sl2 button[data-i="rep"]::before{content:"▥"}
.side .sl2 button[data-i="cfg"]::before{content:"⚙"}
.side .sl2 button[data-i="plan"]::before{content:"◇"}
.side .sl2 button[data-i="link"]::before{content:"↗"}
.side button[aria-pressed=true]{
  color:#fff;
  opacity:1;
  background:linear-gradient(100deg,rgba(223,39,212,.28),rgba(58,169,255,.25));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
}
.side button[aria-pressed=true]::before{
  background:linear-gradient(135deg,#E62AD1,#7A55FF 52%,#24AFFF);
  box-shadow:0 8px 18px rgba(118,77,255,.28);
}
.mn{
  width:min(100%,1200px);
  margin:0 auto;
  padding:38px 30px 76px;
}
.mn h1{
  font-size:2.05rem;
  line-height:1.12;
  letter-spacing:-.05em;
  font-weight:800;
  background:linear-gradient(100deg,#18152A,#6E40F1 55%,#159ED9);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.kp{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin:24px 0;
}
.kc{
  position:relative;
  overflow:hidden;
  min-height:112px;
  padding:18px;
  border:1px solid rgba(255,255,255,.8);
  border-radius:22px;
  background:rgba(255,255,255,.82);
  box-shadow:0 18px 45px rgba(61,50,120,.075);
  backdrop-filter:blur(14px);
}
.kc::after{
  content:"";
  position:absolute;
  right:-22px;
  top:-24px;
  width:88px;
  height:88px;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(230,42,209,.12),rgba(36,175,255,.13));
}
.kc:nth-child(1){
  color:#fff;
  border:0;
  background:linear-gradient(135deg,#7A50F8 0%,#A747EF 48%,#23AFFF 100%);
}
.kc:nth-child(1) span{color:rgba(255,255,255,.78)}
.kc:nth-child(2){background:linear-gradient(145deg,#FFF,#F1EEFF)}
.kc:nth-child(3){background:linear-gradient(145deg,#FFF,#EAF9FF)}
.kc b{
  position:relative;
  z-index:1;
  font-size:2.05rem;
  letter-spacing:-.045em;
}
.kc span{
  position:relative;
  z-index:1;
  display:block;
  margin-top:9px;
  font-size:.78rem;
  font-weight:700;
}
.pn{
  border:1px solid rgba(255,255,255,.85);
  border-radius:24px;
  padding:18px;
  background:rgba(255,255,255,.86);
  box-shadow:0 18px 50px rgba(61,50,120,.065);
  backdrop-filter:blur(14px);
}
.pn h2{
  font-size:1rem;
  letter-spacing:-.025em;
}
.btn{
  border:1px solid #E5E4F0;
  border-radius:13px;
  padding:9px 13px;
  background:rgba(255,255,255,.9);
}
.btn.p,.cta{
  border-color:transparent;
  color:#fff;
  background:linear-gradient(100deg,#E32AD2,#8151FF 52%,#22ABF4);
  box-shadow:0 10px 24px rgba(123,78,245,.18);
}
.cta{border-radius:15px}
input:not([type=checkbox]),select,textarea{
  border:1px solid #E4E3F1;
  border-radius:14px;
  padding:12px 13px;
  background:rgba(255,255,255,.94);
}
.item,.sum{
  border:1px solid #E5E4F1;
  border-radius:18px;
  background:rgba(255,255,255,.9);
}
.tg{
  padding:4px 10px;
}
@media(max-width:800px){
  .sh{display:block;min-height:100vh}
  .side{
    position:sticky;
    top:0;
    z-index:40;
    height:auto;
    padding:10px 14px;
    border:0;
    background:
      radial-gradient(circle at 80% 0%,rgba(42,181,255,.28),transparent 16rem),
      linear-gradient(120deg,#211747,#30165A 70%,#1B1838);
    box-shadow:0 12px 38px rgba(32,22,66,.12);
  }
  .sh2{
    height:54px;
    display:grid;
    grid-template-columns:46px minmax(0,1fr) auto;
    gap:10px;
    align-items:center;
  }
  .side .hb{
    display:grid;
    place-items:center;
    grid-column:1;
    grid-row:1;
    width:42px;
    height:42px;
    margin:0;
    padding:0;
    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
    color:#fff;
    background:rgba(255,255,255,.10);
    font-size:1.15rem;
  }
  .cur{
    display:block;
    grid-column:2;
    grid-row:1;
    color:#fff;
    font-weight:800;
    font-size:.98rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .side h3{
    display:block;
    grid-column:3;
    grid-row:1;
    margin:0;
    max-width:150px;
    color:rgba(255,255,255,.72);
    font-size:.75rem;
    font-weight:700;
    text-align:right;
  }
  .sl2{
    display:none;
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 76px);
    left:12px;
    right:12px;
    z-index:60;
    padding:10px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:24px;
    background:
      radial-gradient(circle at 90% 0%,rgba(35,174,255,.18),transparent 18rem),
      linear-gradient(155deg,#211846,#2D1956 65%,#1C1739);
    box-shadow:0 28px 70px rgba(27,20,60,.30);
    grid-template-columns:1fr 1fr;
    gap:7px;
    max-height:72vh;
    overflow:auto;
  }
  .side.open .sl2{display:grid}
  .side .sl2 button{
    display:flex;
    min-height:52px;
    margin:0;
    padding:9px 10px;
    color:rgba(255,255,255,.76);
    border:1px solid rgba(255,255,255,.06);
    background:rgba(255,255,255,.055);
    font-size:.82rem;
  }
  .side .sl2 button[aria-pressed=true]{
    color:#fff;
    background:linear-gradient(100deg,rgba(226,42,210,.25),rgba(36,174,255,.22));
  }
  .mn{
    padding:25px 16px 92px;
  }
  .mn h1{
    font-size:1.72rem;
  }
  .kp{
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:18px 0;
  }
  .kc{
    min-height:102px;
    padding:15px;
    border-radius:20px;
  }
  .kc:first-child{
    grid-column:span 2;
    min-height:118px;
  }
  .kc b{font-size:1.85rem}
  .pn{
    padding:16px;
    border-radius:21px;
  }
}


/* =========================================================
   FIX MOBILE · radios, configuración y recordatorios
   ========================================================= */
input[type="radio"]{
  width:20px!important;
  min-width:20px!important;
  height:20px;
  padding:0!important;
  margin:0;
  flex:0 0 20px;
  accent-color:var(--acc);
}
.pn label:has(input[type="radio"]){
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-wrap:anywhere;
}
.wa{
  width:100%;
  max-width:100%;
  min-width:0;
  overflow:hidden;
}
.bub{
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.bub span,
.bub small{
  max-width:100%;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.wb{
  width:100%;
  min-width:0;
}
.wb button{
  width:100%;
  max-width:100%;
  white-space:normal;
  overflow-wrap:anywhere;
}
.pn{
  max-width:100%;
  min-width:0;
}
@media(max-width:520px){
  .g2,.g3{
    grid-template-columns:1fr!important;
  }
  .pn label:has(input[type="radio"]){
    display:grid!important;
    grid-template-columns:20px minmax(0,1fr);
    align-items:start!important;
    gap:10px!important;
    line-height:1.35;
  }
  .wa{
    padding:10px;
  }
  .bub{
    padding:10px;
    font-size:.86rem;
  }
}

</style>
</head>

const _nativeFetch = window.fetch.bind(window);
let AUTHORIZED_BUSINESS = null;

function goToLogin(){
  const next = encodeURIComponent(window.location.href);
  window.location.replace("login.html?next=" + next);
}

function goToMyAccount(reason){
  if(reason) sessionStorage.setItem("nuvalite_access_error", reason);
  window.location.replace("mi-cuenta.html");
}

async function verifyBusinessSession(){
  if(!ACCESS_TOKEN){
    goToLogin();
    return false;
  }
  if(!BUSINESS_ID){
    goToMyAccount("Selecciona un negocio desde Mi NUVALITE.");
    return false;
  }

  try{
    const response = await _nativeFetch(API_BASE + "/auth/me", {
      headers:{Authorization:"Bearer " + ACCESS_TOKEN}
    });

    if(response.status === 401){
      localStorage.removeItem("nuvalite_access_token");
      localStorage.removeItem("nuvalite_session");
      goToLogin();
      return false;
    }
    if(!response.ok){
      throw new Error("No se pudo validar la sesión.");
    }

    const me = await response.json();
    AUTHORIZED_BUSINESS = (me.businesses || []).find(function(b){
      return String(b.id) === String(BUSINESS_ID);
    }) || null;

    if(!AUTHORIZED_BUSINESS){
      goToMyAccount("No tienes acceso a ese negocio.");
      return false;
    }
    return true;
  }catch(error){
    console.error("Error validando acceso al negocio:", error);
    goToLogin();
    return false;
  }
}

window.fetch = async function(input, init){
  init = init || {};
  const url = typeof input === "string" ? input : (input && input.url) || "";

  if(url.indexOf(API_BASE) === 0){
    const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
    headers.set("Authorization", "Bearer " + ACCESS_TOKEN);
    init = Object.assign({}, init, {headers:headers});
  }

  const response = await _nativeFetch(input, init);

  if(url.indexOf(API_BASE) === 0 && response.status === 401){
    localStorage.removeItem("nuvalite_access_token");
    localStorage.removeItem("nuvalite_session");
    goToLogin();
  }else if(url.indexOf(API_BASE) === 0 && response.status === 403){
    goToMyAccount("No tienes permisos para acceder a ese negocio.");
  }

  return response;
};

function validateServiceFields(name,duration,price){
 if(!name)return "Escribe el nombre del servicio.";
 if(!Number.isFinite(duration)||duration<=0)return "La duración debe ser mayor que 0 minutos.";
 if(!Number.isFinite(price)||price<0)return "El precio no puede ser negativo.";
 return "";
}

async function addRealService(){
 if(SERVICE_SAVING)return;
 syncServiceCreateDraftFromDom();
 var n=(SERVICE_CREATE_DRAFT.name||"").trim();
 var d=(SERVICE_CREATE_DRAFT.description||"").trim()||null;
 var m=Number(SERVICE_CREATE_DRAFT.duration);
 var priceRaw=SERVICE_CREATE_DRAFT.price;
 var p=priceRaw===""?0:Number(priceRaw);
 var ic=(SERVICE_CREATE_DRAFT.icon||"").trim()||"✨";
 var verr=validateServiceFields(n,m,p);
 if(verr){SERVICE_UI_ERROR=verr;SERVICE_MSG="";render();return}
 var photo=SERVICE_CREATE_PHOTO;
 if(photo){var perr=validateImageFile(photo);if(perr){SERVICE_UI_ERROR=perr;SERVICE_MSG="";render();return}}
 SERVICE_SAVING=true;SERVICE_UI_ERROR="";SERVICE_MSG="";
 var btn=document.querySelector('[data-a="apiAddSvc"]');
 if(btn){btn.disabled=true;btn.textContent=photo?"Creando y subiendo foto...":"Guardando..."}
 var created=null,photoError=null;
 try{
  var response=await fetch(API_BASE+"/businesses/"+BUSINESS_ID+"/services",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,description:d,duration_minutes:m,price:p,icon:ic})});
  if(!response.ok){var er=await response.json().catch(function(){return{}});throw new Error(er.detail||("Error HTTP "+response.status))}
  created=await response.json();
  if(photo&&created&&created.id){
   try{
    var uploaded=await uploadServicePhotoRequest(created.id,photo);
    created.image_url=uploaded.url||created.image_url||null;
   }catch(pe){photoError=pe}
  }
  resetServiceCreateDraft();
  await loadServices();
  if(photoError){
   SERVICE_MSG="";
   SERVICE_UI_ERROR='El servicio "'+n+'" se creó, pero la foto no pudo subirse. Ábrelo en Editar y vuelve a intentar la foto. Detalle: '+photoError.message;
  }else{
   SERVICE_UI_ERROR="";
   SERVICE_MSG='Servicio "'+n+'" creado correctamente'+(photo?' con su foto.':'.');
  }
 }catch(error){
  console.error(error);
  SERVICE_UI_ERROR="No se pudo crear el servicio: "+error.message;
 }finally{
  SERVICE_SAVING=false;
  render();
 }
}

function mediaColumn(kind){return kind==="logo"?"logo_url":kind==="cover"?"cover_image_url":"background_image_url"}
function validateImageFile(file){
 if(!file)return "Selecciona una imagen.";
 if(["image/jpeg","image/png","image/webp"].indexOf(file.type)<0)return "Usa una imagen JPG, PNG o WebP.";
 if(file.size>5*1024*1024)return "La imagen supera el límite de 5 MB.";
 return ""
}

function normalizeAssignedServices(data){
 var arr=[];
 if(Array.isArray(data))arr=data;
 else if(data&&Array.isArray(data.service_ids))arr=data.service_ids;
 else if(data&&Array.isArray(data.services))arr=data.services;
 return arr.map(function(x){
  if(typeof x==="string")return x;
  if(typeof x==="number")return String(x);
  if(x&&x.service_id!=null)return String(x.service_id);
  if(x&&x.id!=null)return String(x.id);
  return null;
 }).filter(Boolean);
}
