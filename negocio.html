<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#14101c;color:#fff;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar small{opacity:.65;width:100%;font-size:.75rem}
.bar button{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.85rem}
.bar button[aria-pressed=true]{background:#fff;color:#14101c}
.bar select{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:999px;padding:5px 10px;font-size:.85rem}.bar select option{color:#14101c}
.lk{background:none;border:0;color:var(--acc);font-weight:700;text-decoration:underline;cursor:pointer;margin-top:10px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mg .btn{text-align:center;text-decoration:none;color:var(--ink)}
.wa{margin-top:12px;background:color-mix(in srgb,#25D366 12%,var(--bg));border-radius:14px;padding:12px}

.tg.c{background:#DCE8FF;color:#2551A8}.tg.n{background:#E7E3EA;color:#5B5163}
.soft{background:color-mix(in srgb,var(--acc) 12%,var(--sf))}

.cp{padding:18px 18px 24px;flex:1}
.top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;padding:14px 12px 0}
.top h2{margin:0;text-align:center;font-size:1.05rem}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:none;font-size:1.2rem;cursor:pointer}
.hero{text-align:center;padding:34px 22px 22px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 22%,var(--sf)),var(--sf))}
.brand{font:700 1.7rem Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
.mark{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 2rem Georgia,serif;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:1.9rem;margin:22px 0 4px;letter-spacing:-.02em}
.feat{display:flex;justify-content:space-around;margin:20px 0;font-size:.78rem;color:var(--mute)}
.feat b{display:block;font-size:1.4rem}
.cta{width:100%;background:var(--acc);color:var(--on);border:0;border-radius:14px;padding:14px;font-weight:700;cursor:pointer;margin-top:14px}
.cta:disabled{opacity:.4;cursor:not-allowed}
.btn{background:var(--sf);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.o{border-color:var(--acc);color:var(--acc)}.btn:disabled{opacity:.4;cursor:not-allowed}

.item small{display:block;color:var(--mute)}

.av.r{border-radius:50%;font-weight:800;color:#fff;font-size:1.1rem}
.grow{flex:1}

.cal button{aspect-ratio:1;border:0;border-radius:50%;background:none;cursor:pointer}

.sl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sl button{border:1.5px solid var(--line);background:var(--sf);border-radius:10px;padding:10px;cursor:pointer}
.sl button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.sl button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
label{display:block;font-size:.82rem;color:var(--mute);margin:12px 0 4px}
input:not([type=checkbox]),select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--sf)}
input[type=color]{height:44px;padding:3px}
.sum{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:6px}
.ok{text-align:center;font-size:3rem}
.rw{display:flex;gap:10px;align-items:center;padding:6px 0}
.sh{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 80px)}
.side{background:var(--side);color:#fff;padding:18px 12px}
.side h3{margin:0 8px 18px;font:700 1.15rem Georgia,serif;letter-spacing:.06em}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;opacity:.75;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.side button[aria-pressed=true]{background:rgba(255,255,255,.14);opacity:1;font-weight:700}
.sh2{display:flex;align-items:center}.side .hb,.cur{display:none}
@media(max-width:800px){.sh{grid-template-columns:1fr;min-height:0}.side{padding:8px 12px}.sh2{gap:12px}
.side h3{margin:0;font-size:.95rem;opacity:.8;order:3}
.side .hb{display:block;order:0;width:44px;height:44px;padding:0;margin:0;background:rgba(255,255,255,.16);opacity:1;text-align:center;font-size:1.35rem}
.cur{display:block;order:1;flex:1;font-weight:700}
.sl2{display:none;margin-top:8px;padding-bottom:6px}.side.open .sl2{display:block}
.side .sl2 button{padding:13px 14px;font-size:1rem}}
.mn{padding:20px 16px 50px;min-width:0}
.mn h1{margin:0;font-size:1.5rem;letter-spacing:-.02em}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.kc{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px}
.kc b{display:block;font-size:1.6rem;line-height:1.1}.kc span{font-size:.8rem;color:var(--mute)}
.pn{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;overflow-x:auto}
.pn h2{margin:0 0 10px;font-size:1.05rem}
table{border-collapse:collapse;width:100%;min-width:480px}
th{font-size:.78rem;text-align:left;color:var(--mute);padding:6px;font-weight:600}
td{border-top:1px solid var(--line);padding:6px;vertical-align:top;font-size:.85rem}
td.off{background:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--mute) 14%,transparent) 6px 12px)}
td.t{color:var(--mute);font-size:.75rem;width:56px;white-space:nowrap}
.ap{border-radius:8px;padding:5px 8px;font-size:.78rem;font-weight:600;background:color-mix(in srgb,var(--c) 28%,var(--sf));border-left:4px solid var(--c)}
.ap small{display:block;font-weight:500;color:var(--mute)}
.tg{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;background:#DDF3E8;color:#16794C}
.tg.w{background:#FFF0D6;color:#9A6200}.tg.x{background:#FBE0DD;color:#B3372A}
.dn{display:flex;gap:6px;align-items:center;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--sf);border-radius:99px;padding:6px 12px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}


/* Final separated demo: internal prototype switcher is hidden. */
.bar{display:none!important}
</style>

function normalizeAssignedServices(data){
 var arr=[];
 if(Array.isArray(data))arr=data;
 else if(data&&Array.isArray(data.service_ids))arr=data.service_ids;
 else if(data&&Array.isArray(data.services))arr=data.services;
 return arr.map(function(x){
  if(typeof x==="string")return x;
  if(typeof x==="number")return String(x);
  if(x&&x.service_id!=null)return String(x.service_id);
  if(x&&x.id!=null)return String(x.id);
  return null;
 }).filter(Boolean);
}

function normalizeSchedules(data){
 var arr=Array.isArray(data)?data:(data&&Array.isArray(data.schedules)?data.schedules:[]);
 return arr.map(function(x){
  return {
   id:x.id||null,
   weekday:Number(x.weekday),
   start_time:(x.start_time||"08:00").slice(0,5),
   end_time:(x.end_time||"17:00").slice(0,5),
   is_active:x.is_active!==false
  };
 });
}
function defaultScheduleRows(){
 var out=[];
 for(var i=1;i<=7;i++)out.push({weekday:i,start_time:"08:00",end_time:"17:00",is_active:i<=5});
 return out;
}

  var rows=normalizeSchedules(await response.json());
