<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CitaGo · Negocio</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"><style>
:root{
  --bg:#fbf5f7;--sf:#fff;--ink:#251c2c;--mut:#746a7a;--line:#eadfe5;
  --acc:#6d5bd0;--side:#251d45;--ok:#16794c;--warn:#9a6200;--bad:#b3372a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:20px 12px}
.side h2{font:700 1.25rem Georgia,serif;margin:0 8px 18px}
.side button{display:block;width:100%;border:0;background:none;color:#fff;opacity:.78;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}
.side button.on{background:rgba(255,255,255,.14);opacity:1;font-weight:800}
.main{padding:24px;min-width:0}
.wrap{max-width:1000px;margin:auto}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.kpi b{display:block;font-size:1.8rem}.kpi span{color:var(--mut);font-size:.82rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:8px 12px;font-weight:700}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{border-color:#efb2aa;color:var(--bad)}
.item{border:1px solid var(--line);background:var(--sf);border-radius:14px;padding:12px;margin:8px 0}
.item small{display:block;color:var(--mut)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:.75rem;font-weight:800;background:#e4f4eb;color:var(--ok)}
.tag.w{background:#fff0d6;color:var(--warn)}.tag.x{background:#fbe0dd;color:var(--bad)}
.muted{color:var(--mut)}
.err{background:#fbe0dd;color:var(--bad);padding:10px;border-radius:10px}
.ok{background:#e4f4eb;color:var(--ok);padding:10px;border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem}
.loading{opacity:.7}
.hero{max-width:520px;margin:28px auto;background:var(--sf);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -35px #6d5bd0}
.heroHead{text-align:center;padding:30px;background:linear-gradient(180deg,#eee9ff,#fff)}
.mark{width:74px;height:74px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;margin:auto;font:700 2rem Georgia,serif;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.heroBody{padding:18px}
.choice{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0;background:#fff}
.choice .ico{font-size:1.4rem;width:36px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px}
.slots button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5;padding:8px;display:flex;overflow:auto}.side h2{display:none}.side button{white-space:nowrap;width:auto}.main{padding:16px}.g2,.g3{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div id="app"></div><script>
const API="https://citago-backend.onrender.com";
const BUSINESS_ID=new URLSearchParams(location.search).get("id")||"1f47d94d-55d6-4a5d-88fc-dc93eaaa3958";
let view="home",dateOffset=0,state={dash:null,appointments:[],services:[],pros:[],blocks:[],reminders:null,reports:null,settings:null,subscription:null,error:"",loading:false};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-CO");
const today=()=>{let d=new Date();d.setDate(d.getDate()+dateOffset);return d.toISOString().slice(0,10)};
async function api(path,opts={}){let r=await fetch(API+path,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||"HTTP "+r.status);return d}
async function loadCurrent(){
 state.error="";state.loading=true;render();
 try{
  if(view==="home")state.dash=await api("/businesses/"+BUSINESS_ID+"/dashboard?date="+today());
  if(view==="appointments")state.appointments=await api("/businesses/"+BUSINESS_ID+"/appointments");
  if(view==="services")state.services=await api("/businesses/"+BUSINESS_ID+"/services");
  if(view==="pros")state.pros=await api("/businesses/"+BUSINESS_ID+"/professionals");
  if(view==="blocks")state.blocks=await api("/businesses/"+BUSINESS_ID+"/blocks");
  if(view==="reminders")state.reminders=await api("/businesses/"+BUSINESS_ID+"/reminders/settings");
  if(view==="reports")state.reports=await api("/businesses/"+BUSINESS_ID+"/reports/summary?date_from="+today()+"&date_to="+today());
  if(view==="settings")state.settings=await api("/businesses/"+BUSINESS_ID+"/settings");
  if(view==="plan")state.subscription=await api("/businesses/"+BUSINESS_ID+"/subscription");
 }catch(e){state.error=e.message}finally{state.loading=false;render()}
}
async function patchStatus(id,status){try{await api("/businesses/"+BUSINESS_ID+"/appointments/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,reason:"Actualizado desde panel del negocio"})});await loadCurrent()}catch(e){alert(e.message)}}
async function addService(){
 const name=document.getElementById("sn").value.trim(),duration=+document.getElementById("sm").value,price=+document.getElementById("sp").value||0;
 if(!name||!duration)return alert("Completa nombre y duración.");
 await api("/businesses/"+BUSINESS_ID+"/services",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,description:null,duration_minutes:duration,price,icon:"✨"})});loadCurrent();
}
async function addPro(){
 const name=document.getElementById("pn").value.trim(),specialty=document.getElementById("pr").value.trim();
 if(!name)return alert("Escribe el nombre.");
 await api("/businesses/"+BUSINESS_ID+"/professionals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,specialty:specialty||null,phone:null,email:null,color:null})});loadCurrent();
}
async function addBlock(){
 const reason=document.getElementById("br").value.trim(),start_at=document.getElementById("bs").value,end_at=document.getElementById("be").value,all_business=document.getElementById("ba").checked,professional_id=document.getElementById("bp").value||null;
 if(!reason||!start_at||!end_at)return alert("Completa motivo, inicio y fin.");
 await api("/businesses/"+BUSINESS_ID+"/blocks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reason,start_at,end_at,all_business,professional_id})});loadCurrent();
}
async function delBlock(id){await api("/businesses/"+BUSINESS_ID+"/blocks/"+id,{method:"DELETE"});loadCurrent()}
async function saveRem(){
 await api("/businesses/"+BUSINESS_ID+"/reminders/settings",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({reminder_24h_enabled:document.getElementById("r24").checked,reminder_2h_enabled:document.getElementById("r2").checked})});loadCurrent();
}
async function saveSettings(){
 const body={name:document.getElementById("cfgName").value,tagline:document.getElementById("cfgTag").value,primary_color:document.getElementById("cfgColor").value,whatsapp:document.getElementById("cfgWa").value,booking_mode:document.getElementById("cfgMode").value,default_open_time:document.getElementById("cfgOpen").value,default_close_time:document.getElementById("cfgClose").value,slot_minutes:+document.getElementById("cfgSlot").value};
 await api("/businesses/"+BUSINESS_ID+"/settings",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});loadCurrent();
}
function statusName(s){return ({PENDING:"Pendiente",CONFIRMED:"Confirmada",COMPLETED:"Completada",CANCELLED:"Cancelada",NO_SHOW:"No asistió",REJECTED:"Rechazada"})[s]||s}
function nav(){const items=[["home","🏠 Inicio"],["appointments","📋 Citas"],["services","✂️ Servicios"],["pros","👥 Profesionales"],["blocks","⛔ Bloqueos"],["reminders","💬 Recordatorios"],["reports","📊 Reportes"],["settings","⚙️ Configuración"],["plan","💎 Mi plan"]];return '<aside class="side"><h2>CitaGo</h2>'+items.map(x=>'<button data-v="'+x[0]+'" class="'+(view===x[0]?"on":"")+'">'+x[1]+'</button>').join("")+'</aside>'}
function home(){
 const d=state.dash;if(!d)return '<div class="card">Sin datos.</div>';const a=d.appointments;
 return '<h1>'+esc(d.business_name)+'</h1><p class="sub">'+d.date+' · '+esc(d.timezone)+'</p><div class="row"><button class="btn" data-a="day" data-i="-1">←</button><b>'+today()+'</b><button class="btn" data-a="day" data-i="1">→</button></div><div class="grid" style="margin-top:14px">'+[["Citas",a.total],["Pendientes",a.pending],["Confirmadas",a.confirmed],["Completadas",a.completed],["Canceladas",a.cancelled],["No asistieron",a.no_show]].map(x=>'<div class="card kpi"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join("")+'</div><div class="card"><b>Próximas citas activas: '+d.upcoming_appointments+'</b></div>';
}
function appointments(){
 return '<h1>Citas</h1><p class="sub">Datos reales de Neon</p>'+state.appointments.map(a=>'<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(a.client.name)+'</b><span class="tag '+(a.status==="PENDING"?"w":(["CANCELLED","REJECTED"].includes(a.status)?"x":""))+'">'+statusName(a.status)+'</span></div><p class="muted">'+esc(a.service.name)+' · '+esc(a.professional.name||"—")+'<br>'+a.date+' '+a.start_time+' · '+esc(a.client.phone)+'</p>'+(a.status==="PENDING"?'<div class="row"><button class="btn p" data-st="CONFIRMED" data-id="'+a.id+'">Aprobar</button><button class="btn" data-st="REJECTED" data-id="'+a.id+'">Rechazar</button></div>':a.status==="CONFIRMED"?'<div class="row"><button class="btn p" data-st="COMPLETED" data-id="'+a.id+'">Completada</button><button class="btn" data-st="NO_SHOW" data-id="'+a.id+'">No asistió</button><button class="btn" data-st="CANCELLED" data-id="'+a.id+'">Cancelar</button></div>':'')+'</div>').join("")||'<div class="card">No hay citas.</div>';
}
function services(){
 return '<h1>Servicios</h1><p class="sub">Servicios reales del negocio</p>'+state.services.map(s=>'<div class="item"><b>'+esc(s.icon||"✨")+' '+esc(s.name)+'</b><small>'+s.duration_minutes+' min · '+money(s.price)+(s.is_active===false?" · Pausado":"")+'</small></div>').join("")+'<div class="card"><h3>Nuevo servicio</h3><div class="g3"><input id="sn" placeholder="Nombre"><input id="sm" type="number" placeholder="Min"><input id="sp" type="number" placeholder="$"></div><button class="btn p" data-a="addService" style="margin-top:10px">Agregar</button></div>';
}
function pros(){
 return '<h1>Profesionales</h1><p class="sub">Equipo real del negocio</p>'+state.pros.map(p=>'<div class="item"><b>'+esc(p.name)+'</b><small>'+esc(p.specialty||"Sin especialidad")+'</small></div>').join("")+'<div class="card"><h3>Agregar profesional</h3><div class="g2"><input id="pn" placeholder="Nombre"><input id="pr" placeholder="Especialidad"></div><button class="btn p" data-a="addPro" style="margin-top:10px">Agregar</button></div>';
}
function blocks(){
 const proOpts='<option value="">Seleccionar profesional</option>'+state.pros.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("");
 return '<h1>Bloqueos</h1><p class="sub">Almuerzos, vacaciones, festivos o cierres</p>'+state.blocks.map(b=>'<div class="item"><b>⛔ '+esc(b.reason)+'</b><small>'+new Date(b.start_at).toLocaleString("es-CO")+' → '+new Date(b.end_at).toLocaleString("es-CO")+' · '+(b.all_business?"Todo el negocio":esc(b.professional_name||"Profesional"))+'</small><button class="btn bad" data-delblock="'+b.id+'">Quitar</button></div>').join("")+'<div class="card"><h3>Nuevo bloqueo</h3><label>Motivo</label><input id="br" placeholder="Ej. Almuerzo"><label>Profesional</label><select id="bp">'+proOpts+'</select><label><input id="ba" type="checkbox" style="width:auto"> Todo el negocio</label><div class="g2"><div><label>Inicio</label><input id="bs" type="datetime-local"></div><div><label>Fin</label><input id="be" type="datetime-local"></div></div><button class="btn p" data-a="addBlock" style="margin-top:10px">Agregar bloqueo</button></div>';
}
function reminders(){
 const r=state.reminders||{reminder_24h_enabled:true,reminder_2h_enabled:true};
 return '<h1>Recordatorios</h1><p class="sub">Configuración del negocio</p><div class="card"><label><input id="r24" type="checkbox" style="width:auto" '+(r.reminder_24h_enabled?"checked":"")+'> 24 horas antes</label><label><input id="r2" type="checkbox" style="width:auto" '+(r.reminder_2h_enabled?"checked":"")+'> 2 horas antes</label><button class="btn p" data-a="saveRem">Guardar</button><p class="muted">El envío automático real por WhatsApp requiere el worker/Cloud API en producción.</p></div>';
}
function reports(){
 const r=state.reports;if(!r)return '<div class="card">Sin datos.</div>';
 return '<h1>Reportes</h1><p class="sub">'+r.date_from+' → '+r.date_to+'</p><div class="grid">'+[["Citas",r.totals.appointments],["Completadas",r.totals.completed],["Canceladas",r.totals.cancelled],["No show",r.totals.no_show],["Ingresos completados",money(r.totals.completed_revenue)]].map(x=>'<div class="card kpi"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join("")+'</div><div class="card"><h3>Por servicio</h3>'+r.by_service.map(x=>'<div class="item"><b>'+esc(x.service_name)+'</b><small>'+x.total+' citas · '+money(x.completed_revenue)+'</small></div>').join("")+'</div>';
}
function settings(){
 const s=state.settings;if(!s)return '<div class="card">Sin datos.</div>';
 return '<h1>Configuración</h1><p class="sub">Marca y reservas</p><div class="card"><label>Nombre</label><input id="cfgName" value="'+esc(s.name)+'"><label>Frase</label><input id="cfgTag" value="'+esc(s.tagline||"")+'"><label>WhatsApp</label><input id="cfgWa" value="'+esc(s.whatsapp||"")+'"><label>Color</label><input id="cfgColor" type="color" value="'+esc(s.primary_color||"#6d5bd0")+'"><label>Modo de reserva</label><select id="cfgMode"><option value="AUTO" '+(s.booking_mode==="AUTO"?"selected":"")+'>Automática</option><option value="MANUAL" '+(s.booking_mode==="MANUAL"?"selected":"")+'>Manual</option></select><div class="g3"><div><label>Apertura</label><input id="cfgOpen" type="time" value="'+String(s.default_open_time||"08:00").slice(0,5)+'"></div><div><label>Cierre</label><input id="cfgClose" type="time" value="'+String(s.default_close_time||"18:00").slice(0,5)+'"></div><div><label>Bloque</label><input id="cfgSlot" type="number" value="'+s.slot_minutes+'"></div></div><button class="btn p" data-a="saveSettings" style="margin-top:10px">Guardar cambios</button></div>';
}
function plan(){
 const x=state.subscription;if(!x||!x.subscription)return '<h1>Mi plan</h1><div class="card">Este negocio todavía no tiene una suscripción asignada.</div>';
 const s=x.subscription,p=s.plan;
 return '<h1>Mi plan</h1><div class="card"><h2>'+esc(p.name)+'</h2><p><b>'+money(p.price_cop)+'</b> / mes</p><span class="tag">'+esc(s.status)+'</span><p class="muted">Profesionales: '+(p.max_professionals??"Ilimitados")+'</p><div class="item">WhatsApp: '+(p.features.whatsapp?"✅":"—")+'</div><div class="item">Reportes: '+(p.features.reports?"✅":"—")+'</div><div class="item">Pagos: '+(p.features.payments?"✅":"—")+'</div><div class="item">Múltiples sedes: '+(p.features.multi_location?"✅":"—")+'</div><p class="muted">Los cambios de plan los controla la Plataforma CitaGo.</p></div>';
}
function content(){return view==="home"?home():view==="appointments"?appointments():view==="services"?services():view==="pros"?pros():view==="blocks"?blocks():view==="reminders"?reminders():view==="reports"?reports():view==="settings"?settings():plan()}
function render(){
 document.getElementById("app").innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="wrap">'+(state.error?'<div class="err">'+esc(state.error)+'</div>':'')+(state.loading?'<div class="card loading">Cargando información real...</div>':content())+'</div></main></div>';
}
document.getElementById("app").addEventListener("click",e=>{
 const nv=e.target.closest("[data-v]");if(nv){view=nv.dataset.v;if(view==="blocks"&&!state.pros.length)api("/businesses/"+BUSINESS_ID+"/professionals").then(x=>{state.pros=x;loadCurrent()});else loadCurrent();return}
 const st=e.target.closest("[data-st]");if(st){patchStatus(st.dataset.id,st.dataset.st);return}
 const b=e.target.closest("[data-a]");if(!b)return;
 if(b.dataset.a==="day"){dateOffset=Math.max(0,dateOffset+(+b.dataset.i));loadCurrent()}
 if(b.dataset.a==="addService")addService();
 if(b.dataset.a==="addPro")addPro();
 if(b.dataset.a==="addBlock")addBlock();
 if(b.dataset.a==="saveRem")saveRem();
 if(b.dataset.a==="saveSettings")saveSettings();
 const db=e.target.closest("[data-delblock]");if(db)delBlock(db.dataset.delblock);
});
loadCurrent();
</script></body></html>
