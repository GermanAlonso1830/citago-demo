<style>
:root{
  --ink:#11162b; --mut:#66708b; --line:#e7eaf4; --paper:#ffffff; --bg:#f7f8fd;
  --navy:#171833; --navy2:#0e1230; --violet:#7657ff; --pink:#f22bcf; --cyan:#10c8ff;
  --green:#20c878; --orange:#ff8d4d; --yellow:#ffc94c; --soft:#f1f2fb;
  --shadow:0 24px 70px rgba(32,39,78,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#fbfcff 0%,#f7f8fd 42%,#fbfbfe 100%);color:var(--ink);font:500 16px/1.55 Manrope,system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(231,234,244,.9)}
.topin{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;font:800 1.08rem "Plus Jakarta Sans",sans-serif}
.brand img{width:38px;height:34px;object-fit:contain}
.brand small{display:block;color:var(--mut);font:600 .63rem Manrope,sans-serif;letter-spacing:.12em;margin-top:-2px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:0;background:transparent;color:#535c77;font-weight:700;padding:10px 12px;border-radius:12px}
.nav button:hover{background:#f1f3fb;color:var(--ink)}
.btn{border:0;border-radius:16px;padding:13px 20px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.2s transform,.2s box-shadow}
.btn:hover{transform:translateY(-1px)}
.btn.primary{color:white;background:linear-gradient(100deg,var(--pink),var(--violet),#1ca8ff);box-shadow:0 12px 28px rgba(118,87,255,.28)}
.btn.dark{background:var(--navy);color:white}
.btn.light{background:white;color:var(--navy);border:1px solid var(--line)}
.btn.ghost{background:transparent;border:1px solid currentColor}
.btn.sm{padding:10px 15px;border-radius:13px;font-size:.9rem}
.menu{display:none;border:0;background:#f1f3fb;width:42px;height:42px;border-radius:13px;font-size:1.4rem}
.menu[aria-expanded="true"]{background:#e9e7ff;color:#4d43bd}
.mobile-menu-backdrop{
  display:none;position:fixed;inset:0;z-index:79;
  background:rgba(13,16,39,.30);backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px)
}
.mobile-menu-backdrop.open{display:block}
.mobile-menu-panel{
  display:none;position:fixed;z-index:80;top:78px;right:18px;
  width:min(330px,calc(100% - 36px));padding:10px;
  border:1px solid rgba(231,234,244,.96);border-radius:22px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 24px 70px rgba(20,27,66,.22);
  transform:translateY(-8px);opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease
}
.mobile-menu-panel.open{
  display:block;transform:translateY(0);opacity:1;pointer-events:auto
}
.mobile-menu-panel button{
  width:100%;border:0;background:transparent;color:#303753;
  padding:13px 14px;border-radius:14px;text-align:left;
  font-weight:800;display:flex;align-items:center;justify-content:space-between;
  gap:12px
}
.mobile-menu-panel button:hover,.mobile-menu-panel button:active{background:#f2f3fb}
.mobile-menu-panel button.primary-mobile{
  margin-top:5px;color:#fff;
  background:linear-gradient(100deg,var(--pink),var(--violet),#1ca8ff)
}
.mobile-menu-panel .mobile-menu-sep{
  height:1px;background:var(--line);margin:6px 4px
}
body.mobile-menu-open{overflow:hidden}
@media(min-width:901px){
  .mobile-menu-panel,.mobile-menu-backdrop{display:none!important}
}
@media(max-width:620px){
  .mobile-menu-panel{top:68px;right:12px;width:calc(100% - 24px)}
}


.page{min-height:70vh}
.eyebrow{text-transform:uppercase;letter-spacing:.19em;font-weight:800;font-size:.72rem;color:#6b75a0}
.hero-home{padding:74px 0 52px;display:grid;grid-template-columns:1.02fr .98fr;gap:56px;align-items:center}
.hero-home h1{font:800 clamp(3.2rem,8vw,6.4rem)/.95 "Plus Jakarta Sans",sans-serif;letter-spacing:-.06em;margin:12px 0 18px}
.gradient-text{background:linear-gradient(90deg,var(--violet),#207dff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.15rem;color:var(--mut);max-width:620px;margin:0 0 26px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.brand-art{min-height:430px;position:relative;border-radius:36px;background:
 radial-gradient(circle at 74% 26%,rgba(16,200,255,.34),transparent 22%),
 radial-gradient(circle at 20% 74%,rgba(242,43,207,.22),transparent 28%),
 linear-gradient(145deg,#eff4ff,#fff 50%,#f4edff);overflow:hidden;border:1px solid #e5e9f6;box-shadow:var(--shadow)}
.brand-art:before{content:"N";position:absolute;font:900 17rem/.8 "Plus Jakarta Sans";color:#186cff;left:9%;top:18%;transform:rotate(-5deg);text-shadow:30px 40px 70px rgba(24,108,255,.22)}
.float-card{position:absolute;background:rgba(255,255,255,.92);border:1px solid white;box-shadow:0 18px 45px rgba(38,49,97,.15);border-radius:20px;padding:14px 16px;backdrop-filter:blur(12px)}
.float-card b{display:block;font-size:1.1rem}
.fc1{right:7%;top:11%} .fc2{left:8%;bottom:10%} .fc3{right:6%;bottom:14%}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}

.apps-hero-art{padding:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#eef3ff,#fff 48%,#f5efff);border:1px solid #e5e9f6}
.apps-hero-art:before{display:none}
.home-carousel{width:100%;position:relative}
.home-carousel-viewport{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:28px}
.home-carousel-viewport::-webkit-scrollbar{display:none}
.home-carousel-track{display:flex}
.home-slide{min-width:100%;scroll-snap-align:start;padding:8px;box-sizing:border-box}
.imac-card{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.96);border-radius:30px;padding:14px 14px 54px;position:relative;box-shadow:0 28px 80px rgba(38,49,97,.16)}
.imac-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.imac-dots{display:flex;gap:7px}
.imac-dots i{width:10px;height:10px;border-radius:50%;display:block;background:#d9def0}
.imac-name{font:800 1rem "Plus Jakarta Sans",sans-serif;color:#1c2140}
.imac-screen{position:relative;aspect-ratio:16/11;border-radius:22px;overflow:hidden;background:#dbe3ff;border:7px solid #11162d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.imac-screen img{width:100%;height:100%;object-fit:cover;display:block}
.imac-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,13,37,.05),rgba(9,13,37,.10) 45%,rgba(9,13,37,.78))}
.imac-chip{position:absolute;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.92);color:#171a33;border:1px solid rgba(255,255,255,.96);padding:8px 11px;border-radius:999px;font:800 .82rem "Plus Jakarta Sans",sans-serif;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(0,0,0,.12);backdrop-filter:blur(10px)}
.imac-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-style:normal}
.imac-copy{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#fff}
.imac-copy b{display:block;font:800 1.35rem/1.05 "Plus Jakarta Sans",sans-serif;margin-bottom:5px;letter-spacing:-.02em}
.imac-copy span{display:block;color:#eef1ff;font-size:.84rem;line-height:1.38;max-width:92%}
.imac-stand{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:96px;height:10px;border-radius:999px;background:linear-gradient(180deg,#d5daea,#bcc3da)}
.home-carousel-dots{display:flex;justify-content:center;gap:9px;margin-top:14px}
.home-carousel-dots button{width:10px;height:10px;border-radius:999px;border:0;background:#c8d0ea;padding:0}
.home-carousel-dots button.active{width:28px;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan))}
.company-strip{padding:0 0 66px}
.company-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.company-item{background:white;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;gap:14px;align-items:flex-start}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.35rem;flex:none}

.citalite-floatbar{
  position:fixed;
  z-index:75;
  top:calc(40px + env(safe-area-inset-top));
  left:50%;

  opacity:0;
  pointer-events:none;
  transform:translate(-50%, -18px);
  transition:
    opacity .28s ease,
    transform .28s ease;

  width:min(92%,760px);
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border:1px solid rgba(255,255,255,.82);
  border-radius:24px;
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 50px rgba(10,15,45,.22);
}

.citalite-floatbar.visible{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%, 0);
}

.citalite-floatbar[hidden]{display:none}
.float-back{
  border:0;background:#f1f3fb;color:#20243f;

let heroAutoTimer=null;
let homeAutoTimer=null;
let heroCarouselState={index:0,userTouching:false};

function setFloatBar(){
 const bar=$("#citaliteFloatBar");
 if(!bar)return;

 const isCitaLite =
   S.view==="portal" &&
   S.current==="citalite";

 if(!isCitaLite){
   bar.hidden=true;
   bar.classList.remove("visible");
   return;
 }

 bar.hidden=false;

 if(window.scrollY > 100){
   bar.classList.add("visible");
 }else{
   bar.classList.remove("visible");
 }
}

window.addEventListener(
  "scroll",
  setFloatBar,
  {passive:true}
);


function initHomeCarousel(){
 clearInterval(homeAutoTimer);

 const viewport=$("#homeAppsCarousel");
 const dotsBox=$("#homeAppsDots");
 if(!viewport||!dotsBox)return;

 const slides=[...viewport.querySelectorAll(".home-slide")];
 homeCarouselState.index=0;

 dotsBox.innerHTML=slides.map((_,i)=>
   `<button type="button" data-home-dot="${i}" class="${i===0?"active":""}" aria-label="Ir a la aplicación ${i+1}"></button>`
 ).join("");

 const dots=[...dotsBox.children];
 const updateDots=()=>dots.forEach((d,i)=>d.classList.toggle("active",i===homeCarouselState.index));

 const goTo=i=>{
   if(!slides.length)return;
   homeCarouselState.index=(i+slides.length)%slides.length;
   const target=slides[homeCarouselState.index];
   viewport.scrollTo({left:target.offsetLeft-viewport.offsetLeft,behavior:"smooth"});
   updateDots();
 };

 let scrollTimer=null;
 viewport.addEventListener("scroll",()=>{
   clearTimeout(scrollTimer);
   scrollTimer=setTimeout(()=>{
     const center=viewport.scrollLeft+viewport.clientWidth/2;
     let best=0,bestDistance=Infinity;
     slides.forEach((slide,i)=>{
       const slideCenter=slide.offsetLeft+slide.offsetWidth/2;
       const distance=Math.abs(slideCenter-center);
       if(distance<bestDistance){best=i;bestDistance=distance;}
     });
     homeCarouselState.index=best;
     updateDots();
   },80);
 },{passive:true});

 const pause=()=>{homeCarouselState.userTouching=true};
 const resume=()=>{homeCarouselState.userTouching=false};
 viewport.addEventListener("touchstart",pause,{passive:true});
 viewport.addEventListener("touchend",resume,{passive:true});
 viewport.addEventListener("pointerdown",pause,{passive:true});
 viewport.addEventListener("pointerup",resume,{passive:true});
 viewport.addEventListener("pointercancel",resume,{passive:true});

 homeAutoTimer=setInterval(()=>{
   if(!homeCarouselState.userTouching)goTo(homeCarouselState.index+1);
 },3600);

 window.__homeGo=goTo;
}

function initHeroCarousel(){
 clearInterval(heroAutoTimer);

 const viewport=$("#heroPhotoCarousel");
 const dotsBox=$("#heroCarouselDots");
 if(!viewport||!dotsBox)return;

 const slides=[...viewport.querySelectorAll(".hero-photo-slide")];
 heroCarouselState.index=0;

 dotsBox.innerHTML=slides.map((_,i)=>
   `<button type="button" data-hero-dot="${i}" class="${i===0?"active":""}" aria-label="Ir a la imagen ${i+1}"></button>`
 ).join("");

 const dots=[...dotsBox.children];

 const updateDots=()=>{
   dots.forEach((d,i)=>d.classList.toggle("active",i===heroCarouselState.index));
 };

 const goTo=i=>{
   if(!slides.length)return;
   heroCarouselState.index=(i+slides.length)%slides.length;
   const target=slides[heroCarouselState.index];
   viewport.scrollTo({
     left:target.offsetLeft-viewport.offsetLeft,
     behavior:"smooth"
   });
   updateDots();
 };

 let scrollTimer=null;
 viewport.addEventListener("scroll",()=>{
   clearTimeout(scrollTimer);
   scrollTimer=setTimeout(()=>{
     const center=viewport.scrollLeft+viewport.clientWidth/2;
     let best=0;
     let bestDistance=Infinity;

     slides.forEach((slide,i)=>{
       const slideCenter=slide.offsetLeft+slide.offsetWidth/2;
       const distance=Math.abs(slideCenter-center);
       if(distance<bestDistance){
         best=i;
         bestDistance=distance;
       }
     });

     heroCarouselState.index=best;
     updateDots();
   },80);
 },{passive:true});

 const pause=()=>{heroCarouselState.userTouching=true};
 const resume=()=>{heroCarouselState.userTouching=false};

 viewport.addEventListener("touchstart",pause,{passive:true});
 viewport.addEventListener("touchend",resume,{passive:true});
 viewport.addEventListener("pointerdown",pause,{passive:true});
 viewport.addEventListener("pointerup",resume,{passive:true});
 viewport.addEventListener("pointercancel",resume,{passive:true});

 heroAutoTimer=setInterval(()=>{
   if(!heroCarouselState.userTouching){
     goTo(heroCarouselState.index+1);
   }
 },3800);

 window.__heroGo=goTo;
}

 const val=id=>$("#"+id).value.trim();
 const fail=m=>$("#formError").innerHTML=`<div class="error">${m}</div>`;
 if(!val("bizName")||!val("ownerName"))return fail("Escribe el nombre del negocio y tu nombre.");
 if(val("phone").replace(/\D/g,"").length<7)return fail("Escribe un WhatsApp válido.");
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val("email")))return fail("Escribe un correo válido.");
 if(!val("bizType"))return fail("Selecciona el tipo de negocio.");
 if(!$("#terms").checked)return fail("Debes aceptar los términos y la política de datos.");
 S.user=val("ownerName");
 if(APPS[S.current].available){
   S.trials.push({app:S.current,biz:val("bizName"),type:val("bizType"),start:S.elapsed});
   S.view="account";
 }else S.view="thanks";
 render();
});
render();
</script>
</body>
</html>
